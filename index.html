function fmtDateShort(dateStr){ if(!dateStr) return ''; const d=new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); }

/* ============================================================ ESTADÍSTICAS ============================================================ */
function periodRange(period, offset=0){
  const now=new Date();
  if(period==='week'){
    const day=(now.getDay()+6)%7; const start=new Date(now); start.setDate(now.getDate()-day-offset*7); start.setHours(0,0,0,0);
    const end=new Date(start); end.setDate(start.getDate()+7);
    return {start,end};
  }
  if(period==='month'){
    // Mes de calendario completo: p.ej. 1 de septiembre a 1 de octubre.
    const start=new Date(now.getFullYear(), now.getMonth()-offset, 1);
    const end=new Date(now.getFullYear(), now.getMonth()-offset+1, 1);
    return {start,end};
  }
  if(period==='quarter'){
    const q = Math.floor(now.getMonth()/3);
    const startMonth = q*3 - offset*3;
    const start=new Date(now.getFullYear(), startMonth, 1);
    const end=new Date(now.getFullYear(), startMonth+3, 1);
    return {start,end};
  }
  if(period==='year'){
    const start=new Date(now.getFullYear()-offset,0,1); const end=new Date(now.getFullYear()-offset+1,0,1);
    return {start,end};
  }
  return {start:new Date(2000,0,1), end:new Date(2100,0,1)};
}
function inRange(dateStr, range){ const d=new Date(dateStr+'T00:00:00'); return d>=range.start && d<range.end; }
function filterByRange(list, range){ return list.filter(m=>inRange(m.date, range)); }

function renderStats(){
  const el=document.getElementById('statsMain');
  const range=periodRange(statsPeriod,0), prevRange=periodRange(statsPeriod,1);
  const current=filterByRange(movements, range), previous=filterByRange(movements, prevRange);
  const totals=movementTotals(current), prevTotals=movementTotals(previous);
  const delta=(cur,prev)=> prev===0 ? null : Math.round(((cur-prev)/prev)*100);
  const gDelta=delta(totals.gasto,prevTotals.gasto), iDelta=delta(totals.ingreso,prevTotals.ingreso);
  const deltaHtml=(d)=> d===null? '' : `<div class="delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d)}% vs periodo anterior</div>`;

  // --- Analítica extra: días del periodo, gasto medio diario, categoría top, mayor gasto individual ---
  const dayCount = Math.max(1, Math.round((Math.min(range.end, new Date()) - range.start) / 86400000));
  const avgDaily = totals.gasto / dayCount;
  const gastosDelPeriodo = current.filter(m => m.type === 'gasto');
  const biggest = gastosDelPeriodo.slice().sort((a,b) => b.amount - a.amount)[0];
  const catTotalsMap = {};
  gastosDelPeriodo.forEach(m => { const k = m.category_id || '__none__'; catTotalsMap[k] = (catTotalsMap[k]||0) + Number(m.amount); });
  const topCatEntry = Object.entries(catTotalsMap).sort((a,b) => b[1]-a[1])[0];
  const topCatName = topCatEntry ? (financeCategories.find(c => c.id == topCatEntry[0])?.name || 'Sin categoría') : '—';
  const savingsRate = totals.ingreso > 0 ? Math.round(((totals.ingreso - totals.gasto) / totals.ingreso) * 100) : null;

  el.innerHTML = `
    <div class="fin-header">
      <h2>Estadísticas</h2>
      <select class="period-sel" id="statsPeriodSel">
        <option value="week">Esta semana</option><option value="month">Este mes</option><option value="quarter">Este trimestre</option><option value="year">Este año</option><option value="all">Todo</option>
      </select>
    </div>
    <div class="summary-row">
      <div class="summary-card gasto"><div class="label">Gastos</div><div class="value">${money(totals.gasto)}</div>${statsPeriod!=='all'?deltaHtml(gDelta):''}</div>
      <div class="summary-card ingreso"><div class="label">Ingresos</div><div class="value">${money(totals.ingreso)}</div>${statsPeriod!=='all'?deltaHtml(iDelta):''}</div>
      <div class="summary-card balance"><div class="label">Balance</div><div class="value">${money(totals.ingreso-totals.gasto)}</div></div>
    </div>

    <div class="insight-row">
      <div class="insight-card"><div class="ic-wrap">${chartIcon()}</div><div><div class="ilabel">Gasto medio diario</div><div class="ivalue">${money(avgDaily)}</div></div></div>
      <div class="insight-card"><div class="ic-wrap" style="background:var(--peach);color:var(--peach-ink);">${trophyIcon()}</div><div><div class="ilabel">Categoría con más gasto</div><div class="ivalue">${escapeHtml(topCatName)}</div>${topCatEntry ? `<div class="isub">${money(topCatEntry[1])}</div>` : ''}</div></div>
      <div class="insight-card"><div class="ic-wrap" style="background:var(--rose);color:var(--rose-ink);">${sparkleIcon()}</div><div><div class="ilabel">Mayor gasto individual</div><div class="ivalue">${biggest ? money(biggest.amount) : '—'}</div>${biggest ? `<div class="isub">${escapeHtml(biggest.description || 'Sin descripción')}</div>` : ''}</div></div>
      ${savingsRate !== null ? `<div class="insight-card"><div class="ic-wrap" style="background:var(--mint);color:var(--mint-ink);">${walletIcon()}</div><div><div class="ilabel">Tasa de ahorro</div><div class="ivalue">${savingsRate}%</div><div class="isub">del ingreso no gastado</div></div></div>` : ''}
    </div>

    <div class="stats-section"><h3>Ranking de categorías de gasto</h3><div id="gastoRanking"></div></div>
    <div class="stats-section"><h3>Ranking de categorías de ingreso</h3><div id="ingresoRanking"></div></div>
    ${group ? `<div class="stats-section"><h3>Gastos del grupo por quién pagó</h3><div id="paidByBars"></div></div>` : ''}
    <div class="stats-section"><h3>Tendencia (últimos 6 meses)</h3><div id="trendChart"></div></div>
    <div class="stats-section"><h3>Evolución dentro del periodo</h3><div id="timeTable"></div></div>
  `;
  document.getElementById('statsPeriodSel').value=statsPeriod;
  document.getElementById('statsPeriodSel').onchange=e=>{statsPeriod=e.target.value;renderStats();};
  renderRanking('gastoRanking', current.filter(m=>m.type==='gasto'), totals.gasto);
  renderRanking('ingresoRanking', current.filter(m=>m.type==='ingreso'), totals.ingreso);
  if(group){
    const groupMovs = current.filter(m=>m.group_id && m.type==='gasto');
    const totalGroup = groupMovs.reduce((s,m)=>s+Number(m.amount),0);
    renderBars('paidByBars', groupMovs, totalGroup, 'pagador');
  }
  renderTrendChart('trendChart');
  renderTimeTable('timeTable', current, statsPeriod);
}
function renderRanking(containerId, list, total){
  const container = document.getElementById(containerId);
  const byCat = {};
  list.forEach(m => { const key = m.category_id || '__none__'; byCat[key] = (byCat[key]||0) + Number(m.amount); });
  const rows = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  if(!rows.length){ container.innerHTML = `<div class="empty" style="padding:20px;"><span class="emoji">🏅</span><strong>Sin datos</strong>Todavía no hay movimientos en este periodo.</div>`; return; }
  container.innerHTML = '';
  rows.forEach(([key, amount], i) => {
    const idx = financeCategories.findIndex(c => c.id == key);
    const label = idx >= 0 ? financeCategories[idx].name : 'Sin categoría';
    const c = idx >= 0 ? colorFor(idx) : {bg:'#EDEAE4', ink:'#928F8A'};
    const pct = total ? Math.round((amount/total)*100) : 0;
    const row = document.createElement('div');
    row.className = 'rank-row' + (i===0?' top1':i===1?' top2':i===2?' top3':'');
    row.innerHTML = `
      <div class="rank-num">${i+1}</div>
      <div class="rank-info">
        <div class="rank-name"><span class="dot" style="background:${c.ink}"></span>${escapeHtml(label)}</div>
        <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${pct}%;background:${c.ink};"></div></div>
      </div>
      <div class="rank-pct">${pct}%</div>
      <div class="rank-amount">${money(amount)}</div>
    `;
    container.appendChild(row);
  });
}
function renderTrendChart(containerId){
  const container = document.getElementById(containerId);
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d);
  }
  const monthly = months.map(d => {
    const range = { start: d, end: new Date(d.getFullYear(), d.getMonth()+1, 1) };
    const list = filterByRange(movements, range);
    return movementTotals(list);
  });
  const maxVal = Math.max(1, ...monthly.map(m => Math.max(m.gasto, m.ingreso)));
  container.innerHTML = `<div class="trend-chart">${months.map((d,i) => `
    <div class="trend-col">
      <div class="trend-bars">
        <div class="trend-bar g" style="height:${Math.max(2, Math.round(monthly[i].gasto/maxVal*100))}%" title="Gastos: ${money(monthly[i].gasto)}"></div>
        <div class="trend-bar i" style="height:${Math.max(2, Math.round(monthly[i].ingreso/maxVal*100))}%" title="Ingresos: ${money(monthly[i].ingreso)}"></div>
      </div>
      <div class="trend-label">${d.toLocaleDateString('es-ES',{month:'short'})}</div>
    </div>`).join('')}</div>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--ink-soft);">
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:var(--rose);display:inline-block;"></span>Gastos</span>
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:var(--mint);display:inline-block;"></span>Ingresos</span>
    </div>`;
}
function renderBars(containerId, list, total, mode){
  const container=document.getElementById(containerId);
  const byKey={};
  list.forEach(m=>{ const key = mode==='pagador' ? (m.paid_by||'__none__') : (m.category_id||'__none__'); byKey[key]=(byKey[key]||0)+Number(m.amount); });
  const rows=Object.entries(byKey).sort((a,b)=>b[1]-a[1]);
  if(!rows.length){ container.innerHTML=`<div class="empty" style="padding:20px;"><span class="emoji">📊</span><strong>Sin datos</strong>Todavía no hay movimientos en este periodo.</div>`; return; }
  container.innerHTML='';
  rows.forEach(([key,amount],i)=>{
    let label, c;
    if(mode==='pagador'){ label = userName(key==='__none__'?null:key); c = colorFor(i); }
    else { const idx=financeCategories.findIndex(c=>c.id==key); label = idx>=0?financeCategories[idx].name:'Sin categoría'; c = idx>=0?colorFor(idx):{bg:'#EDEAE4',ink:'#928F8A'}; }
    const pct = total ? Math.round((amount/total)*100) : 0;
    const row=document.createElement('div'); row.className='bar-row';
    row.innerHTML = `<div class="bar-label"><span class="dot" style="background:${c.ink}"></span>${escapeHtml(label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${c.bg};box-shadow:inset 0 0 0 1.5px ${c.ink}55;"></div></div>
      <div class="bar-amount">${money(amount)}</div>`;
    container.appendChild(row);
  });
}
function renderTimeTable(containerId, list, period){
  const container=document.getElementById(containerId);
  const buckets={};
  const keyFor = (dateStr) => {
    const d=new Date(dateStr+'T00:00:00');
    if(period==='week') return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'});
    if(period==='month') return 'Semana ' + Math.ceil(d.getDate()/7);
    if(period==='quarter') return d.toLocaleDateString('es-ES',{month:'short'});
    if(period==='year') return d.toLocaleDateString('es-ES',{month:'short'});
    return String(d.getFullYear());
  };
  list.forEach(m=>{
    const k=keyFor(m.date);
    if(!buckets[k]) buckets[k]={gasto:0,ingreso:0};
    buckets[k][m.type]+=Number(m.amount);
  });
  const keys=Object.keys(buckets);
  if(!keys.length){ container.innerHTML=`<div class="empty" style="padding:20px;"><span class="emoji">🗓️</span><strong>Sin movimientos</strong>en este periodo todavía.</div>`; return; }
  let rows = keys.map(k => `<tr><td>${escapeHtml(k)}</td><td class="num g">${money(buckets[k].gasto)}</td><td class="num i">${money(buckets[k].ingreso)}</td><td class="num b">${money(buckets[k].ingreso-buckets[k].gasto)}</td></tr>`).join('');
  container.innerHTML = `<table class="time-table"><thead><tr><th></th><th>Gastos</th><th>Ingresos</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ============================================================ GRUPO ============================================================ */
let groupCreating = false;
function applyGroupsBundle(b){
  groupsData = (b && b.groups) || []; groupInvites = (b && b.invites) || [];
  myGroups = groupsData.map(g => ({ id:g.id, name:g.name }));            // los usa el diálogo de compartir
}
async function groupAction(fn){
  if(groupBusy) return;
  groupBusy = true;
  try{ applyGroupsBundle(await fn()); }
  catch(e){ showToast(e.message); }
  finally{ groupBusy = false; renderGrupo(); updateGroupBadge(); }
}
function updateGroupBadge(){
  document.querySelectorAll('[data-nav="grupo"]').forEach(b => {
    b.querySelector('.nav-dot')?.remove();
    if(groupInvites.length){ const d = document.createElement('span'); d.className = 'nav-dot'; d.textContent = groupInvites.length; b.appendChild(d); }
  });
}
function renderGrupo(){
  const el = document.getElementById('grupoMain');
  el.innerHTML = `
    <div class="fin-header"><h2>Grupos</h2><button class="btn btn-primary btn-sm" id="grpNewToggle" style="margin-left:auto;">${plusIcon()} Crear grupo</button></div>
    <div id="grpCreateBox"></div>
    <div id="grpInvites"></div>
    <div id="grpList"></div>`;

  document.getElementById('grpNewToggle').onclick = () => { groupCreating = !groupCreating; renderGrupo(); };
  if(groupCreating){
    document.getElementById('grpCreateBox').innerHTML = `<div class="grp-create"><input type="text" id="grpNameInput" placeholder="Nombre del grupo (familia, equipo…)" maxlength="60"><button class="btn btn-primary" id="grpCreateBtn">Crear</button></div>`;
    const input = document.getElementById('grpNameInput'); input.focus();
    const create = async () => {
      const name = input.value.trim(); if(!name){ input.focus(); return; }
      groupCreating = false;
      await groupAction(() => api('?resource=my_groups', { method:'POST', body: JSON.stringify({ name }) }));
    };
    document.getElementById('grpCreateBtn').onclick = create;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') create(); if(e.key === 'Escape'){ groupCreating = false; renderGrupo(); } });
  }

  const invBox = document.getElementById('grpInvites');
  invBox.innerHTML = '';
  groupInvites.forEach(inv => {
    const card = document.createElement('div');
    card.className = 'invite-card';
    card.innerHTML = `<span class="ic-text"><strong>@${escapeHtml(inv.invited_by)}</strong> te ha invitado al grupo <strong>${escapeHtml(inv.group_name)}</strong></span>
      <span class="ic-btns"><button class="btn btn-primary btn-sm" data-a="yes">Aceptar</button><button class="btn btn-outline btn-sm" data-a="no">Rechazar</button></span>`;
    card.querySelector('[data-a="yes"]').onclick = () => groupAction(() => api('?resource=group_invites&id='+inv.id, { method:'PATCH', body: JSON.stringify({ accept:true }) }));
    card.querySelector('[data-a="no"]').onclick = () => groupAction(() => api('?resource=group_invites&id='+inv.id, { method:'PATCH', body: JSON.stringify({ accept:false }) }));
    invBox.appendChild(card);
  });

  const list = document.getElementById('grpList');
  if(!groupsData.length){
    list.innerHTML = `<div class="empty"><span class="emoji">👥</span><strong>Todavía no estás en ningún grupo</strong>Crea uno e invita a otras personas por su nombre de usuario, o espera a que te inviten.</div>`;
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grp-grid';
  groupsData.forEach(g => {
    const owner = g.my_role === 'owner';
    const card = document.createElement('div');
    card.className = 'grp-card';
    card.innerHTML = `
      <div class="grp-top"><h3></h3>
        ${owner ? '<span class="grp-badge owner">Propietario</span>' : ''}
        ${g.is_expenses ? '<span class="grp-badge exp">Gastos compartidos</span>' : ''}
        ${!g.has_owner ? '<span class="grp-badge">Gestionado por el administrador</span>' : ''}
      </div>
      <div><div class="grp-label">Miembros · ${g.members.length}</div><div class="grp-members"></div></div>
      ${owner ? `<div>
          <div class="grp-label">Invitar a alguien</div>
          <div class="grp-invite"><input type="text" placeholder="Nombre de usuario" maxlength="60"><button class="btn btn-soft">Invitar</button></div>
          ${g.pending.length ? `<div class="grp-pending" style="margin-top:10px;"><div class="grp-label">Invitaciones pendientes</div><div class="pend-list"></div></div>` : ''}
        </div>` : ''}
      ${(owner || g.has_owner) ? `<div class="grp-foot"><button class="btn btn-danger btn-sm" data-foot>${owner ? 'Eliminar grupo' : 'Salir del grupo'}</button></div>` : ''}`;
    card.querySelector('h3').textContent = g.name;

    const members = card.querySelector('.grp-members');
    g.members.forEach(m => {
      const row = document.createElement('div');
      row.className = 'grp-member';
      row.innerHTML = `<span class="avatar">${initials(m.username)}</span><span class="gm-name"></span>${m.role==='owner' ? '<span class="gm-role">propietario</span>' : ''}`;
      row.querySelector('.gm-name').textContent = m.username + (m.id == me.id ? ' (tú)' : '');
      if(owner && m.id != me.id && m.role !== 'owner'){
        const x = document.createElement('button');
        x.className = 'icon-btn'; x.title = 'Quitar del grupo'; x.innerHTML = xSvg();
        x.onclick = () => { if(confirm(`¿Quitar a @${m.username} de "${g.name}"?`)) groupAction(() => api(`?resource=group_members&group_id=${g.id}&user_id=${m.id}`, { method:'DELETE' })); };
        row.appendChild(x);
      }
      members.appendChild(row);
    });

    if(owner){
      const input = card.querySelector('.grp-invite input'), btn = card.querySelector('.grp-invite button');
      const invite = async () => {
        const username = input.value.trim(); if(!username){ input.focus(); return; }
        await groupAction(() => api('?resource=group_invites', { method:'POST', body: JSON.stringify({ group_id:g.id, username }) }));
      };
      btn.onclick = invite;
      input.addEventListener('keydown', e => { if(e.key === 'Enter') invite(); });
      const pend = card.querySelector('.pend-list');
      if(pend) g.pending.forEach(pi => {
        const chip = document.createElement('span');
        chip.className = 'pending-chip';
        chip.innerHTML = `<span></span><button class="icon-btn" title="Cancelar invitación">${xSvg()}</button>`;
        chip.querySelector('span').textContent = '@' + pi.username;
        chip.querySelector('button').onclick = () => groupAction(() => api('?resource=group_invites&id='+pi.id, { method:'DELETE' }));
        pend.appendChild(chip);
      });
    }
    const foot = card.querySelector('[data-foot]');
    if(foot) foot.onclick = () => {
      if(owner){
        if(confirm(`¿Eliminar el grupo "${g.name}"? Las notas y diagramas que se compartieron con él dejarán de verse.`)) groupAction(() => api('?resource=my_groups&id='+g.id, { method:'DELETE' }));
      } else if(confirm(`¿Salir del grupo "${g.name}"?`)) groupAction(() => api(`?resource=group_members&group_id=${g.id}&user_id=${me.id}`, { method:'DELETE' }));
    };
    grid.appendChild(card);
  });
  list.appendChild(grid);
  const hint = document.createElement('p');
  hint.className = 'grp-hint'; hint.style.marginTop = '16px';
  hint.textContent = 'Un grupo te permite compartir notas y diagramas con varias personas a la vez: usa el botón Compartir dentro de la nota o del diagrama.';
  list.appendChild(hint);
}

/* ============================================================ ADMIN ============================================================ */
init();
</script>
</body>
</html>
