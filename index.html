  .hdr-actions .notif-toggle{width:38px;height:38px;margin:0;flex-shrink:0;}
  .drawer .th-txt::after{content:'Tema: automático';}
  html[data-theme-pref="light"] .drawer .th-txt::after{content:'Tema: claro';}

const SNAP_KEYS = { '?resource=all': 'snap_all' };
function snapGet(k){ try{ return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function snapSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function snapClear(){ try{ ['snap_all','snap_me'].forEach(k => localStorage.removeItem(k)); Object.keys(localStorage).filter(k => k.startsWith('chat_')).forEach(k => localStorage.removeItem(k)); } catch(e){} }
async function api(path, options = {}) {
  const snapKey = !options.method && SNAP_KEYS[path];
  let res;
  try { res = await fetch(API_BASE + path, { headers: { 'Content-Type': 'application/json' }, ...options }); }
  catch(netErr){                                         // sin red: para la carga inicial se usa la última copia guardada
    const snap = snapKey && snapGet(snapKey);
    if (snap) { window.offlineMode = true; return snap; }
    throw netErr;
  }
  window.offlineMode = false;
  if (res.status === 401) { me = null; render(); throw new Error('no autenticado'); }
  if (!res.ok) {
    const e = await res.json().catch(()=>({error:'Error'}));
    const err = new Error(e.error || ('Error ' + res.status));
    err.status = res.status; err.data = e;
    if (res.status === 403 && String(e.code || '').startsWith('module_')) showToast(e.error);   // mensaje de permisos configurado por el administrador
    throw err;
  }
  const out = res.status === 204 ? null : await res.json();
  if (snapKey && out) snapSet(snapKey, out);
  return out;
}
async function authApi(path, options = {}) {
  let res;
  try { res = await fetch(AUTH_BASE + path, { headers: { 'Content-Type': 'application/json' }, ...options }); }
  catch(netErr){
    const snap = path === '?action=me' && snapGet('snap_me');
    if (snap) { window.offlineMode = true; return snap; }
    throw netErr;
  }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'Error');
  if (path === '?action=me' && data) snapSet('snap_me', data);
  return data;
}

/* ============================================================ INIT ============================================================ */
async function init(){
  loadWeatherLocation();
  try { me = await authApi('?action=me'); } catch(e){ me = null; }
  if (me) { try { await loadAll(); } catch(e){} }
  render();
}

async function loadAll(){
  const data = await api('?resource=all');
  categories = data.categories || [];
  tags = data.tags || [];
  tasks = (data.tasks || []).map(t => ({ reminders: [], notified: [], due_at: null, ...t, id:String(t.id) }));
  financeCategories = data.finance_categories || [];
  movements = data.movements || [];
  budgets = data.budgets || [];
  group = data.group || null;
  groupMembers = data.group_members || [];
  notes = data.notes || [];
  myGroups = data.my_groups || [];
  groupsData = (data.groups_data && data.groups_data.groups) || [];
  groupInvites = (data.groups_data && data.groups_data.invites) || [];
  applyWeatherLocations(data.weather_locations || []);
  loans = data.loans || [];
  recurringItems = data.recurring_items || [];
  diagrams = []; diagramsLoaded = false;
  if(data.weather_location){ weatherLocation = data.weather_location; try{ localStorage.setItem('weatherLocation', JSON.stringify(weatherLocation)); } catch(e){} }
}

/* ============================================================ RENDER ROOT ============================================================ */
function render(){
  const app = document.getElementById('app');
  if (!me) { renderAuth(app); return; }
  if (!document.getElementById('shell')) buildShell(app);
  if (currentSection !== 'admin' && currentSection !== 'perfil' && modState(currentSection) === 'hidden') currentSection = (navItems()[0] || {id:'perfil'}).id;
  document.querySelectorAll('.navbtn,.mobilenav button,.drawer-nav-item').forEach(b => b.classList.toggle('active', b.dataset.nav === currentSection));
  const moreBtn = document.getElementById('mobileMoreBtn');
  if (moreBtn) moreBtn.classList.toggle('active', !MOBILE_PRIMARY.includes(currentSection));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const sec = document.getElementById('section-' + currentSection);
  if (sec) sec.classList.add('active');
  const titles = { hoy:'Hoy', compra:'Lista de la compra', tareas:'Tareas', calendario:'Calendario', chat:'Chat', notas:'Notas', gastos:'Gastos', estadisticas:'Estadísticas', grupo:'Grupos', admin:'Administración', perfil:'Perfil', tiempo:'Tiempo', diagramas:'Diagramas' };
  const lv = document.getElementById('lockedView');
  const locked = currentSection !== 'admin' && currentSection !== 'perfil' && modState(currentSection) === 'locked';
  if (lv) {
    lv.style.display = locked ? 'flex' : 'none';
    if (locked) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      const label = (navItems().find(i => i.id === currentSection) || {}).label || 'Módulo';
      lv.innerHTML = `<div class="lock-orb">${lockIcon()}</div><h2>${escapeHtml(label)} no está disponible</h2><p>${escapeHtml(modMessage(currentSection))}</p>
        <button class="btn btn-soft" id="lockedBack">Volver</button>`;
      document.getElementById('lockedBack').onclick = () => { const first = navItems().find(i => !i.locked); currentSection = first ? first.id : 'perfil'; render(); };
    }
  }
  const titleEl = document.getElementById('headerTitle');
  if (titleEl) titleEl.textContent = titles[currentSection] || 'App Gestión Personal';
  renderNotifBtn();
  renderHeaderWeather();
  updateGroupBadge();

  if (locked) { if (window.MobileX) MobileX.onRender(); return; }
  if (currentSection === 'hoy' && window.renderHoy) renderHoy();
  if (currentSection === 'compra' && window.renderCompra) renderCompra();
  if (currentSection === 'tareas'){ renderTabs(); renderNewCatForm(); renderMain(); }
  if (currentSection === 'calendario') renderCalendario();
  if (currentSection === 'chat' && window.renderChat) renderChat();
  if (currentSection === 'notas'){ renderNotas(); refreshNotes(); }
  if (currentSection === 'gastos') renderGastos();
  if (currentSection === 'estadisticas') renderStats();
  if (currentSection === 'grupo') renderGrupo();
  if (currentSection === 'admin' && me.role === 'admin') renderAdmin();
  if (currentSection === 'perfil') renderPerfil();
  if (currentSection === 'tiempo') renderWeatherSection();
  if (currentSection === 'diagramas') renderDiagramas();
  if (window.MobileX) MobileX.onRender();
}

/* ============================================================ AUTH SCREEN ============================================================ */
function renderAuth(app){
  document.documentElement.classList.remove('in-app');
  app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <h1><span class="dot"></span>App Gestión Personal</h1>
      <div class="auth-sub">Tareas, gastos y estadísticas, todo en un sitio.</div>
      <div class="auth-tabs">
        <button class="auth-tab ${authMode==='login'?'active':''}" id="tabLogin">Entrar</button>
        <button class="auth-tab ${authMode==='register'?'active':''}" id="tabRegister">Crear cuenta</button>
      </div>
      <div id="authError"></div>
      <form id="authForm">
        <div class="auth-field"><label>Usuario</label><input type="text" id="authUser" name="username" autocomplete="username" required></div>
        <div class="auth-field"><label>Contraseña</label><input type="password" id="authPass" name="password" autocomplete="current-password" required></div>
        <button type="submit" class="auth-btn" id="authSubmit">${authMode==='login'?'Entrar':'Crear cuenta'}</button>
      </form>
    </div></div>`;
  document.getElementById('tabLogin').onclick = () => { authMode='login'; render(); };
  document.getElementById('tabRegister').onclick = () => { authMode='register'; render(); };
  document.getElementById('authForm').addEventListener('submit', e => { e.preventDefault(); submitAuth(); });
}

async function submitAuth(){
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const btn = document.getElementById('authSubmit');
  const errBox = document.getElementById('authError');
  errBox.innerHTML = '';
  if(!username || !password) return;
  btn.disabled = true;
  try {
    me = await authApi('?action=' + authMode, { method:'POST', body: JSON.stringify({ username, password }) });
    await loadAll();
    render();
  } catch(e){
    errBox.innerHTML = `<div class="auth-error">${escapeHtml(e.message)}</div>`;
  } finally { btn.disabled = false; }
}

async function logout(){
  snapClear();
  if(window.chatReset) chatReset();
  await authApi('?action=logout', { method:'POST' });
  me = null; document.getElementById('shell')?.remove(); document.documentElement.classList.remove('in-app');
  render();
}

/* Módulos según el rol: allow = se usa · locked = se ve con candado y un mensaje · hidden = no aparece. Admin lo tiene todo. */
function modState(id){ if(!me || me.role === 'admin') return 'allow'; return (me.modules && me.modules[id]) || 'allow'; }
function modMessage(id){ const m = (me && me.messages) || {}; return m[id] || m._default || 'No tienes permiso para usar este módulo.'; }
function modGate(id){ if(modState(id) === 'allow') return true; showToast(modMessage(id)); return false; }
let MOBILE_PRIMARY = ['hoy','tareas','chat','compra','gastos'];
function lockIcon(){ return '<svg class="lockic" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'; }
function navItems(){
  const items = [
    {id:'hoy', ic:homeIcon(), label:'Hoy'},
    {id:'tareas', ic:checklistIcon(), label:'Tareas'},
    {id:'calendario', ic:calendarIcon(), label:'Calendario'},
    {id:'chat', ic:chatIcon(), label:'Chat'},
    {id:'compra', ic:cartIcon(), label:'Compra'},
    {id:'notas', ic:noteIcon(), label:'Notas'},
    {id:'diagramas', ic:diagramIcon(), label:'Diagramas'},
    {id:'gastos', ic:walletIcon(), label:'Gastos'},
    {id:'estadisticas', ic:chartIcon(), label:'Stats'},
    {id:'tiempo', ic:weatherIcon(), label:'Tiempo'},
    {id:'grupo', ic:peopleIcon(), label:'Grupos'},
  ];
  const out = items.filter(i => modState(i.id) !== 'hidden').map(i => ({ ...i, locked: modState(i.id) === 'locked' }));
  if (me.role === 'admin') out.push({id:'admin', ic:shieldIcon(), label:'Admin'});
  out.push({id:'perfil', ic:personIcon(), label:'Perfil'});
  return out;
}

/* ============================================================ DIAGRAMAS (Excalidraw autoalojado) ============================================================ */
let diagrams = [], diagramsLoaded = false;
let diagramEditor = null, editingDiagramId = null, editingDiagramIsNew = false;
let diagramSaveTimer = null, diagramTitleTimer = null, diagramDirty = false, diagramSaving = false, diagramModuleP = null;
let diagramAccess = 'owner', diagramUpdatedAt = null, diagramQueue = Promise.resolve();

function loadDiagramEditorModule(){
  if(diagramModuleP) return diagramModuleP;
  diagramModuleP = (async () => {
    // Carpeta que contiene /fonts (Excalidraw las pide desde aquí, no desde un CDN)
    window.EXCALIDRAW_ASSET_PATH = new URL('./diagrams/', location.href).href;
    if(!document.getElementById('diagramCss')){
      const link = document.createElement('link');
      link.id = 'diagramCss'; link.rel = 'stylesheet'; link.href = './diagrams/diagram-editor.css';
      document.head.appendChild(link);
    }
    return import('./diagrams/diagram-editor.js');
  })();
  diagramModuleP.catch(() => { diagramModuleP = null; });
  return diagramModuleP;
}

async function renderDiagramas(){
  const el = document.getElementById('diagramasMain');
  if(!diagramsLoaded){
    el.innerHTML = `<div class="fin-header"><h2>Mis diagramas</h2></div><div style="color:var(--ink-soft);font-size:13.5px;padding:30px 0;text-align:center;">Cargando…</div>`;
    try{ diagrams = await api('?resource=diagrams'); diagramsLoaded = true; lastDiagramsRefresh = Date.now(); }
    catch(e){
      el.innerHTML = `<div class="empty"><strong>No se pudieron cargar los diagramas</strong>${escapeHtml(e.message)}. ¿Está creada la tabla <code>diagrams</code>?</div>`;
      return;
    }
  }
  if(currentSection !== 'diagramas') return;
  refreshDiagrams();
  el.innerHTML = `
    <div class="fin-header"><h2>Mis diagramas</h2></div>
    ${diagrams.length ? '<div class="diagram-grid" id="diagramGrid"></div>'
      : `<div class="empty"><span class="emoji">🧩</span><strong>Sin diagramas todavía</strong>Crea el primero con el botón +: casos de uso, flujos, esquemas…</div>`}
    <button class="fab" id="newDiagramFab" title="Nuevo diagrama">${plusIcon()}</button>
  `;
  document.getElementById('newDiagramFab').onclick = () => openDiagram(null);
  const grid = document.getElementById('diagramGrid');
  if(!grid) return;
  diagrams.forEach(d => {
    const isOwner = !d.access || d.access === 'owner';
    const card = document.createElement('div');
    card.className = 'diagram-card';
    const thumb = document.createElement('div');
    thumb.className = 'diagram-thumb';
    if(d.thumbnail){ const img = document.createElement('img'); img.alt = ''; img.src = d.thumbnail; thumb.appendChild(img); }
    else thumb.innerHTML = diagramIcon();
    const info = document.createElement('div');
    info.className = 'diagram-info';
    info.innerHTML = `<div class="dtitle">${escapeHtml(d.title || 'Diagrama sin título')}${shareBadge(d)}</div><div class="dmeta">${noteRelDate(d.updated_at)}${isOwner ? '' : ' · de @' + escapeHtml(d.owner_username)}</div>`;
    card.onclick = () => openDiagram(d.id);
    card.appendChild(thumb); card.appendChild(info);
    if(isOwner){
      const del = document.createElement('button');
      del.className = 'diagram-del'; del.title = 'Eliminar'; del.innerHTML = trashSvg();
      del.onclick = e => { e.stopPropagation(); deleteDiagram(d.id, d.title, d.share_count); };
      card.appendChild(del);
    }
    grid.appendChild(card);
  });
}

let lastDiagramsRefresh = Date.now();
async function refreshDiagrams(){
  if(Date.now() - lastDiagramsRefresh < 15000) return;
  lastDiagramsRefresh = Date.now();
  try{
    const list = await api('?resource=diagrams');
    const changed = JSON.stringify(list.map(d => [d.id, d.title, d.updated_at, d.access, d.share_count])) !== JSON.stringify(diagrams.map(d => [d.id, d.title, d.updated_at, d.access, d.share_count]));
    diagrams = list;
    if(changed && currentSection === 'diagramas' && !editingDiagramId) renderDiagramas();
  } catch(e){}
}
async function deleteDiagram(id, title, shareCount){
  const extra = shareCount > 0 ? `\n\nEstá compartido con ${shareCount} ${shareCount === 1 ? 'destinatario' : 'destinatarios'}: dejarán de verlo.` : '';
  if(!confirm(`¿Eliminar el diagrama "${title || 'sin título'}"?${extra}\n\nEsta acción no se puede deshacer.`)) return;
  await api('?resource=diagrams&id='+id, { method:'DELETE' });
  diagrams = diagrams.filter(d => d.id != id);
  renderDiagramas();
}

async function openDiagram(id){
  const overlay = document.getElementById('diagramOverlay');
  const canvas = document.getElementById('diagramCanvas');
  const titleInput = document.getElementById('diagramTitleInput');
  const ind = document.getElementById('diagramSaveIndicator');
  const shareBtn = document.getElementById('diagramShareBtn');
  const accessInfo = document.getElementById('diagramAccessInfo');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  canvas.innerHTML = '<div class="diagram-loading">Cargando editor…</div>';
  titleInput.value = ''; titleInput.readOnly = true; ind.textContent = ''; accessInfo.textContent = ''; shareBtn.style.display = 'none';
  diagramDirty = false;
  try{
    const mod = await loadDiagramEditorModule();
    const record = id
      ? await api('?resource=diagrams&id='+id)
      : await api('?resource=diagrams', { method:'POST', body: JSON.stringify({ title:'Diagrama sin título' }) });
    editingDiagramId = record.id; editingDiagramIsNew = !id;
    diagramAccess = record.access || 'owner'; diagramUpdatedAt = record.updated_at; diagramQueue = Promise.resolve();
    if(!id) diagrams.unshift({ id: record.id, title: record.title, thumbnail: null, updated_at: record.updated_at, access: 'owner', owner_username: me.username, share_count: 0 });
    titleInput.value = record.title || '';
    titleInput.readOnly = diagramAccess === 'view';
    if(diagramAccess === 'owner') shareBtn.style.display = '';
    else accessInfo.textContent = `de @${record.owner_username} · ${diagramAccess === 'view' ? 'solo lectura' : 'puedes editar'}`;
    canvas.innerHTML = '';
    diagramEditor = mod.mountDiagramEditor(canvas, { scene: record.scene || null, langCode: 'es-ES', readOnly: diagramAccess === 'view', onChange: scheduleDiagramSave });
  } catch(e){
    console.error('[diagramas]', e);
    showToast('No se pudo abrir el editor: ' + e.message);
    overlay.classList.remove('open'); canvas.innerHTML = ''; document.body.style.overflow = '';
  }
}

function scheduleDiagramSave(){
  if(diagramAccess === 'view') return;
  diagramDirty = true;
  const ind = document.getElementById('diagramSaveIndicator');
  if(ind) ind.textContent = 'Escribiendo…';
  clearTimeout(diagramSaveTimer);
  diagramSaveTimer = setTimeout(saveDiagramNow, 1500);
}

/* Todos los PATCH de un diagrama van en cola (título y escena): así la fecha de versión
   que se envía como base es siempre la de la última respuesta del servidor. */
function diagramPatch(fields){
  const run = async () => {
    const j = await api('?resource=diagrams&id='+editingDiagramId, { method:'PATCH', body: JSON.stringify({ ...fields, base_updated_at: diagramUpdatedAt }) });
    diagramUpdatedAt = j.updated_at;
    return j;
  };
  const p = diagramQueue.then(run);
  diagramQueue = p.catch(() => {});
  return p;
}

async function saveDiagramNow(){
  if(!diagramEditor || !editingDiagramId || diagramAccess === 'view') return;
  if(diagramSaving){ diagramSaveTimer = setTimeout(saveDiagramNow, 800); return; }
  diagramSaving = true; diagramDirty = false;
  const ind = document.getElementById('diagramSaveIndicator');
  let scene = null, thumbnail = null;
  try{
    scene = diagramEditor.getScene();
    if(!scene) throw new Error('editor no disponible');
    thumbnail = await diagramEditor.getThumbnail();
    await diagramPatch({ scene, thumbnail });
    const d = diagrams.find(x => x.id == editingDiagramId);
    if(d){ d.thumbnail = thumbnail; d.updated_at = diagramUpdatedAt; }
    if(ind) ind.textContent = 'Guardado';
  } catch(e){
    if(e.status === 409){
      try{ await resolveDiagramConflict(scene, thumbnail, e.data && e.data.updated_at); }
      catch(e2){ console.error('[diagramas] conflicto', e2); diagramDirty = true; if(ind) ind.textContent = 'Error al guardar'; }
    } else {
      console.error('[diagramas] guardado', e);
      diagramDirty = true;
      if(ind) ind.textContent = 'Error al guardar';
    }
  } finally { diagramSaving = false; }
}

async function resolveDiagramConflict(scene, thumbnail, serverUpdatedAt){
  const ind = document.getElementById('diagramSaveIndicator');
  const overwrite = confirm('Otra persona ha guardado cambios en este diagrama mientras lo editabas.\n\nAceptar: guardar tu versión (sobrescribe la suya).\nCancelar: cargar su versión (pierdes tus cambios).');
  if(overwrite){
    diagramUpdatedAt = serverUpdatedAt;
    await diagramPatch({ scene, thumbnail });
    if(ind) ind.textContent = 'Guardado';
  } else {
    await reloadDiagramFromServer();
    if(ind) ind.textContent = 'Versión más reciente cargada';
  }
}

async function reloadDiagramFromServer(){
  const mod = await loadDiagramEditorModule();
  const record = await api('?resource=diagrams&id='+editingDiagramId);
  if(diagramEditor){ diagramEditor.unmount(); diagramEditor = null; }
  const canvas = document.getElementById('diagramCanvas');
  canvas.innerHTML = '';
  diagramUpdatedAt = record.updated_at; diagramDirty = false;
  document.getElementById('diagramTitleInput').value = record.title || '';
  diagramEditor = mod.mountDiagramEditor(canvas, { scene: record.scene || null, langCode: 'es-ES', readOnly: diagramAccess === 'view', onChange: scheduleDiagramSave });
}

async function closeDiagram(){
  clearTimeout(diagramSaveTimer);
  while(diagramSaving) await new Promise(r => setTimeout(r, 80));
  await diagramQueue;
  if(diagramEditor){
    const scene = diagramEditor.getScene();
    const isEmpty = !scene || !(scene.elements || []).some(e => !e.isDeleted);
    if(editingDiagramIsNew && isEmpty){
      try{ await api('?resource=diagrams&id='+editingDiagramId, { method:'DELETE' }); } catch(e){}
      diagrams = diagrams.filter(d => d.id != editingDiagramId);
    } else if(diagramDirty){
      await saveDiagramNow();
    }
    diagramEditor.unmount(); diagramEditor = null;
  }
  editingDiagramId = null; editingDiagramIsNew = false;
  document.getElementById('diagramOverlay').classList.remove('open');
  document.getElementById('diagramCanvas').innerHTML = '';
  document.body.style.overflow = '';
  diagrams.sort((a,b) => (parseServerDate(b.updated_at) || 0) - (parseServerDate(a.updated_at) || 0));
  if(currentSection === 'diagramas') renderDiagramas();
}

function onDiagramTitleInput(){
  if(diagramAccess === 'view') return;
  clearTimeout(diagramTitleTimer);
  diagramTitleTimer = setTimeout(async () => {
    if(!editingDiagramId) return;
    const title = document.getElementById('diagramTitleInput').value.trim() || 'Diagrama sin título';
    try{
      await diagramPatch({ title });
      const d = diagrams.find(x => x.id == editingDiagramId); if(d){ d.title = title; d.updated_at = diagramUpdatedAt; }
    } catch(e){
      if(e.status === 409) showToast('Otra persona ha modificado este diagrama: tu cambio de título no se guardó. Vuelve a abrirlo para ver su versión.');
    }
  }, 600);
}

function renderShareList(){

    sel.onchange = async () => {
      const prev = sh.permission;
      try{ const r = await api('?resource=shares&id=' + sh.id, { method:'PATCH', body: JSON.stringify({ permission: sel.value }) }); sh.permission = r.permission; }
      catch(e){ sel.value = prev; showToast('No se pudo cambiar el permiso.'); }
    };
    const del = document.createElement('button');
    del.className = 'task-del'; del.title = 'Quitar acceso'; del.innerHTML = trashSvg();

}
async function addShare(){
  const btn = document.getElementById('shareAddBtn');
  const payload = { type: shareCtx.type, rid: shareCtx.id, permission: document.getElementById('sharePerm').value };
  if(shareKind === 'user'){
    payload.recipient_type = 'user';
    payload.username = document.getElementById('shareUsername').value.trim();

  } else {
    payload.recipient_type = 'group';
    payload.group_id = Number(document.getElementById('shareGroup').value);
  }
  setShareError(''); btn.disabled = true;
  try{
    const row = await api('?resource=shares', { method:'POST', body: JSON.stringify(payload) });
    const i = shareList.findIndex(x => x.id === row.id);
    if(i >= 0) shareList[i] = row; else shareList.push(row);

    setShareError(e.message);

const WEATHER_CODES = {
  0:  {label:'Despejado', icon:sunIcon},
  1:  {label:'Mayormente despejado', icon:cloudSunIcon},
  2:  {label:'Parcialmente nublado', icon:cloudSunIcon},
  3:  {label:'Nublado', icon:cloudIcon},
  45: {label:'Niebla', icon:fogIcon}, 48: {label:'Niebla escarchada', icon:fogIcon},
  51: {label:'Llovizna ligera', icon:cloudRainIcon}, 53: {label:'Llovizna', icon:cloudRainIcon}, 55: {label:'Llovizna intensa', icon:cloudRainIcon},
  56: {label:'Llovizna helada', icon:cloudRainIcon}, 57: {label:'Llovizna helada intensa', icon:cloudRainIcon},
  61: {label:'Lluvia ligera', icon:cloudRainIcon}, 63: {label:'Lluvia', icon:cloudRainIcon}, 65: {label:'Lluvia intensa', icon:cloudRainIcon},
  66: {label:'Lluvia helada', icon:cloudRainIcon}, 67: {label:'Lluvia helada intensa', icon:cloudRainIcon},
  71: {label:'Nieve ligera', icon:cloudSnowIcon}, 73: {label:'Nieve', icon:cloudSnowIcon}, 75: {label:'Nieve intensa', icon:cloudSnowIcon}, 77: {label:'Granos de nieve', icon:cloudSnowIcon},
  80: {label:'Chubascos ligeros', icon:cloudRainIcon}, 81: {label:'Chubascos', icon:cloudRainIcon}, 82: {label:'Chubascos intensos', icon:cloudRainIcon},
  85: {label:'Chubascos de nieve', icon:cloudSnowIcon}, 86: {label:'Chubascos de nieve intensos', icon:cloudSnowIcon},
  95: {label:'Tormenta', icon:cloudLightningIcon}, 96: {label:'Tormenta con granizo', icon:cloudLightningIcon}, 99: {label:'Tormenta con granizo fuerte', icon:cloudLightningIcon},
};
function weatherInfo(code){ return WEATHER_CODES[code] || {label:'—', icon:cloudIcon}; }

let weatherLocation = null;
let weatherData = null;
let weatherLoading = false, weatherError = null;
let weatherSearchResults = [];

let weatherLocations = [];                // todas las ciudades guardadas (una está activa)
let weatherView = (() => { try{ return localStorage.getItem('weatherView') === 'compact' ? 'compact' : 'full'; } catch(e){ return 'full'; } })();
let weatherAdding = false;
let weatherMini = {};                     // datos ligeros por ciudad para la vista compacta: {id: {ts, ...}}

function loadWeatherLocation(){
  // Se rellena desde el servidor en loadAll(); si por lo que sea no hay sesión todavía,
  // usamos lo último guardado en este dispositivo como respaldo temporal.
  if(weatherLocation) return;
  try{ const raw = localStorage.getItem('weatherLocation'); weatherLocation = raw ? JSON.parse(raw) : null; } catch(e){ weatherLocation = null; }
}
/* El servidor devuelve siempre la lista completa; la ciudad activa alimenta el resto de la app (cabecera, tareas…) */
function applyWeatherLocations(list){
  weatherLocations = list || [];
  const act = weatherLocations.find(l => l.is_active);
  const before = weatherLocation ? weatherLocation.latitude + ',' + weatherLocation.longitude : null;
  weatherLocation = act ? { id:act.id, name:act.name, latitude:Number(act.latitude), longitude:Number(act.longitude) } : null;
  const after = weatherLocation ? weatherLocation.latitude + ',' + weatherLocation.longitude : null;
  if(before !== after) weatherData = null;
  try{ if(weatherLocation) localStorage.setItem('weatherLocation', JSON.stringify(weatherLocation)); else localStorage.removeItem('weatherLocation'); } catch(e){}
}
async function addWeatherCity(r){
  const res = await api('?resource=weather_locations', { method:'POST', body: JSON.stringify({ name: r.name + (r.admin1 ? ', '+r.admin1 : ''), latitude: r.latitude, longitude: r.longitude }) });
  applyWeatherLocations(res.locations);
}
async function setActiveWeatherCity(id){
  applyWeatherLocations((await api('?resource=weather_locations&id='+id, { method:'PATCH', body: JSON.stringify({ is_active:true }) })).locations);
}
async function removeWeatherCity(id){
  applyWeatherLocations((await api('?resource=weather_locations&id='+id, { method:'DELETE' })).locations);
  delete weatherMini[id];
}

async function fetchWeather(){
  if(!weatherLocation) return;
  weatherLoading = true; weatherError = null;
  try{
    const { latitude, longitude } = weatherLocation;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
      `&current=temperature_2m,weather_code,is_day,relative_humidity_2m,wind_speed_10m` +
      `&hourly=temperature_2m,weather_code` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
      `&forecast_days=16&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('No se pudo obtener el tiempo');
    weatherData = await res.json();
  } catch(e){
    weatherError = e.message;
  } finally {
    weatherLoading = false;
  }
}

async function searchWeatherCity(query){
  if(query.trim().length < 2){ weatherSearchResults = []; return; }
  try{
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=es&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    weatherSearchResults = data.results || [];
  } catch(e){ weatherSearchResults = []; }
}

async function renderWeatherSection(){
  loadWeatherLocation();
  const el = document.getElementById('tiempoMain');
  const has = weatherLocations.length > 0;
  el.innerHTML = `
    <div class="wx-bar">
      <h2>Tiempo</h2>
      ${has ? `<div class="seg"><button data-wv="full" class="${weatherView==='full'?'active':''}">Completa</button><button data-wv="compact" class="${weatherView==='compact'?'active':''}">Compacta</button></div>` : ''}
      ${has ? `<button class="btn btn-soft btn-sm" id="wxAddBtn">${plusIcon()} Añadir ciudad</button>` : ''}
    </div>
    ${has ? '<div class="wx-cities" id="wxCities"></div>' : ''}
    <div id="wxAddBox"></div>
    <div id="wxBody"></div>`;
  el.querySelectorAll('[data-wv]').forEach(b => b.onclick = () => {
    weatherView = b.dataset.wv; try{ localStorage.setItem('weatherView', weatherView); } catch(e){}
    renderWeatherSection();
  });
  const addBtn = document.getElementById('wxAddBtn');
  if(addBtn) addBtn.onclick = () => { weatherAdding = !weatherAdding; renderWeatherAddBox(); };
  if(has) renderWeatherCities();
  renderWeatherAddBox();

  if(!has){ body.innerHTML = ''; return; }
  if(weatherView === 'compact') return renderWeatherCompact(body);
  body.innerHTML = `<div style="text-align:center;color:var(--ink-soft);font-size:13.5px;padding:60px 0;">Cargando el tiempo…</div>`;
  if(!weatherData) await fetchWeather();

function renderWeatherCities(){
  const box = document.getElementById('wxCities'); if(!box) return;
  box.innerHTML = '';
  weatherLocations.forEach(l => {
    const chip = document.createElement('div');
    chip.className = 'wx-city' + (l.is_active ? ' active' : '');
    chip.title = l.is_active ? 'Ciudad activa' : 'Usar como ciudad activa';
    chip.innerHTML = `${l.is_active ? checkSvg().replace('stroke="white"','stroke="currentColor"') : locationPinIcon()}<span></span><button class="wx-x" title="Quitar">${xSvg()}</button>`;
    chip.querySelector('span').textContent = l.name.split(',')[0];
    chip.querySelector('.wx-x').onclick = async e => {
      e.stopPropagation();
      if(!confirm(`¿Quitar "${l.name}" de tus ciudades?`)) return;
      try{ await removeWeatherCity(l.id); render(); } catch(err){ showToast('No se pudo quitar: ' + err.message); }
    };
    chip.onclick = async () => {
      if(l.is_active) return;
      try{ await setActiveWeatherCity(l.id); render(); } catch(err){ showToast('No se pudo cambiar: ' + err.message); }
    };
    box.appendChild(chip);
  });
}
function renderWeatherAddBox(){
  const box = document.getElementById('wxAddBox'); if(!box) return;
  const show = weatherAdding || weatherLocations.length === 0;
  if(!show){ box.innerHTML = ''; return; }
  const first = weatherLocations.length === 0;
  box.innerHTML = `<div class="wx-add"><div class="weather-search" ${first ? 'style="margin:40px auto;max-width:420px;text-align:center;"' : ''}>
      ${first ? `<div class="ws-icon">${cloudSunIcon()}</div><h3>¿Qué ubicación quieres consultar?</h3><p>Busca una ciudad para ver el tiempo actual y la previsión. Después podrás añadir más.</p>` : `<p style="margin-bottom:10px;">Busca la ciudad que quieres añadir.</p>`}
      <div class="weather-search-box">${searchIcon()}<input type="text" id="weatherSearchInput" placeholder="Ej. Murcia, Madrid, Totana…"></div>
      <div class="weather-results" id="weatherResults" style="display:none;"></div>
    </div></div>`;
  const input = document.getElementById('weatherSearchInput');

  let debounceTimer;
  input.oninput = e => {
    clearTimeout(debounceTimer);
    const q = e.target.value;
    debounceTimer = setTimeout(async () => { await searchWeatherCity(q); renderWeatherResultsList(); }, 350);
  };

function renderWeatherResultsList(){
  const box = document.getElementById('weatherResults');
  if(!box) return;
  if(!weatherSearchResults.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display = 'block';
  box.innerHTML = weatherSearchResults.map((r,i) => `
    <button class="weather-result-item" data-idx="${i}">${locationPinIcon()}<span>${escapeHtml(r.name)}${r.admin1 ? ', '+escapeHtml(r.admin1) : ''}</span><span class="wr-sub">${escapeHtml(r.country||'')}</span></button>
  `).join('');
  box.querySelectorAll('.weather-result-item').forEach(btn => {
    btn.onclick = async () => {
      const r = weatherSearchResults[btn.dataset.idx];
      btn.disabled = true;
      try{
        await addWeatherCity(r);
        weatherAdding = false; weatherSearchResults = [];
        render();
      } catch(err){ btn.disabled = false; showToast('No se pudo añadir la ciudad: ' + err.message); }
    };
  });
}

/* Vista compacta: una tarjeta pequeña por ciudad (toca una para hacerla la activa) */
async function fetchMiniWeather(loc){
  const c = weatherMini[loc.id];
  if(c && Date.now() - c.ts < 10*60*1000) return c;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}` +
      `&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('x');
    const d = await res.json();
    weatherMini[loc.id] = { ts: Date.now(), temp: d.current.temperature_2m, code: d.current.weather_code, isDay: d.current.is_day === 1,
      max: d.daily.temperature_2m_max[0], min: d.daily.temperature_2m_min[0] };
  } catch(e){ weatherMini[loc.id] = { ts: Date.now() - 9*60*1000, error:true }; }      // reintento en ~1 min
  return weatherMini[loc.id];
}
async function renderWeatherCompact(body){
  body.innerHTML = `<div class="wx-grid" id="wxGrid"></div>`;
  const grid = document.getElementById('wxGrid');
  weatherLocations.forEach(l => {
    const tile = document.createElement('button');
    tile.className = 'wx-tile' + (l.is_active ? ' active' : '');
    tile.dataset.id = l.id;
    tile.innerHTML = `<span class="wxt-name"></span>${l.is_active ? '<span class="wxt-badge">Activa</span>' : ''}<div class="wxt-main"><span class="wxt-temp">…</span></div><span class="wxt-desc">&nbsp;</span><span class="wxt-range">&nbsp;</span>`;
    tile.querySelector('.wxt-name').textContent = l.name.split(',')[0];
    tile.onclick = async () => { if(l.is_active) return; try{ await setActiveWeatherCity(l.id); render(); } catch(err){ showToast('No se pudo cambiar: ' + err.message); } };
    grid.appendChild(tile);
  });
  await Promise.all(weatherLocations.map(async l => {
    const m = await fetchMiniWeather(l);
    const tile = grid.querySelector(`.wx-tile[data-id="${l.id}"]`); if(!tile || !document.body.contains(tile)) return;
    if(!m || m.error){ tile.querySelector('.wxt-temp').textContent = '—'; tile.querySelector('.wxt-desc').textContent = 'Sin datos'; return; }
    const info = weatherInfo(m.code);
    tile.classList.toggle('night', !m.isDay);
    tile.querySelector('.wxt-main').innerHTML = `<span class="wxt-temp">${Math.round(m.temp)}°</span>${info.icon()}`;
    tile.querySelector('.wxt-desc').textContent = info.label;
    tile.querySelector('.wxt-range').textContent = `Máx. ${Math.round(m.max)}° · Mín. ${Math.round(m.min)}°`;
  }));
}

function renderWeatherCard(el){
  if(weatherError){
    el.innerHTML = `<div class="empty"><span class="emoji">🌦️</span><strong>No se pudo cargar el tiempo</strong>${escapeHtml(weatherError)}</div>
      <div style="text-align:center;margin-top:14px;"><button class="btn btn-outline btn-sm" id="weatherRetry">Reintentar</button></div>`;
    document.getElementById('weatherRetry').onclick = async () => { await fetchWeather(); renderWeatherCard(el); };
    return;
  }
  if(!weatherData){ el.innerHTML = `<div style="text-align:center;color:var(--ink-soft);padding:40px 0;">Sin datos todavía.</div>`; return; }

  const cur = weatherData.current;
  const info = weatherInfo(cur.weather_code);
  const isDay = cur.is_day === 1;
  const daily = weatherData.daily;
  const todayMax = Math.round(daily.temperature_2m_max[0]), todayMin = Math.round(daily.temperature_2m_min[0]);
  const globalMax = Math.max(...daily.temperature_2m_max), globalMin = Math.min(...daily.temperature_2m_min);

  const now = new Date();
  const hourly = weatherData.hourly;
  let startIdx = hourly.time.findIndex(t => new Date(t) >= now);
  if(startIdx < 0) startIdx = 0;
  const hourlySlice = [];
  for(let i=startIdx; i<startIdx+24 && i<hourly.time.length; i++){
    hourlySlice.push({ time: hourly.time[i], temp: hourly.temperature_2m[i], code: hourly.weather_code[i] });
  }

  el.innerHTML = `
    <div class="weather-card${isDay?'':' night'}">
      <div class="weather-top">
        <div class="wt-loc">${escapeHtml(weatherLocation.name)}</div>
      </div>
      <div class="weather-hero">
        <div class="wh-icon">${info.icon()}</div>
        <div class="wh-temp">${Math.round(cur.temperature_2m)}°</div>
        <div class="wh-desc">${escapeHtml(info.label)}</div>
        <div class="wh-range">Máx. ${todayMax}° · Mín. ${todayMin}°</div>
      </div>
      <div class="weather-meta-row">
        <div><div>${cur.relative_humidity_2m}%</div><div class="wm-label">Humedad</div></div>
        <div><div>${Math.round(cur.wind_speed_10m)} km/h</div><div class="wm-label">Viento</div></div>
      </div>
      <div class="weather-hourly">${hourlySlice.map(h => {
        const hi = weatherInfo(h.code);
        const label = new Date(h.time).getHours() === now.getHours() && new Date(h.time).toDateString()===now.toDateString() ? 'Ahora' : new Date(h.time).toLocaleTimeString('es-ES',{hour:'2-digit'});
        return `<div class="wh-item"><span class="hlabel">${label}</span>${hi.icon()}<span class="htemp">${Math.round(h.temp)}°</span></div>`;
      }).join('')}</div>
      <div class="weather-daily">${daily.time.map((t,i) => {
        const di = weatherInfo(daily.weather_code[i]);
        const max = Math.round(daily.temperature_2m_max[i]), min = Math.round(daily.temperature_2m_min[i]);
        const dayLabel = i===0 ? 'Hoy' : new Date(t+'T00:00:00').toLocaleDateString('es-ES',{weekday:'short'});
        const pctLeft = globalMax>globalMin ? ((min-globalMin)/(globalMax-globalMin))*100 : 0;
        const pctWidth = globalMax>globalMin ? ((max-min)/(globalMax-globalMin))*100 : 100;
        return `<div class="wd-row">
          <span class="wd-day">${dayLabel}</span>${di.icon()}
          <span class="wd-min">${min}°</span>
          <div class="wd-bar-track"><div class="wd-bar-fill" style="left:${pctLeft}%;width:${Math.max(8,pctWidth)}%;"></div></div>
          <span class="wd-max">${max}°</span>
        </div>`;
      }).join('')}</div>
    </div>
  `;
}

/* -- Integración con el modal de nueva tarea: mostrar el tiempo del día elegido -- */
async function getForecastForDate(dateStr){
  if(!weatherLocation) return null;
  if(!weatherData){ await fetchWeather(); }
  if(!weatherData || !weatherData.daily) return null;
  const idx = weatherData.daily.time.indexOf(dateStr);
  if(idx === -1) return null;
  return {
    code: weatherData.daily.weather_code[idx],
    max: Math.round(weatherData.daily.temperature_2m_max[idx]),
    min: Math.round(weatherData.daily.temperature_2m_min[idx]),
  };
}
async function renderTaskWeatherChip(dateStr){
  const wrap = document.getElementById('ntWeatherChip');
  if(!wrap) return;
  if(!dateStr || !weatherLocation){ wrap.innerHTML = ''; return; }
  const datePart = dateStr.split('T')[0];
  wrap.innerHTML = `<div class="task-weather-chip">${cloudSunIcon()} Consultando el tiempo…</div>`;
  const forecast = await getForecastForDate(datePart);
  if(!forecast){ wrap.innerHTML = ''; return; }
  const info = weatherInfo(forecast.code);
  wrap.innerHTML = `<div class="task-weather-chip">${info.icon()} ${escapeHtml(weatherLocation.name)}: ${escapeHtml(info.label.toLowerCase())}, ${forecast.max}°/${forecast.min}°</div>`;
}

function renderHeaderWeather(){
  const btn = document.getElementById('headerWeather');
  if(!btn) return;
  if(!weatherLocation){ btn.classList.remove('show'); return; }
  if(!weatherData && !weatherLoading){
    weatherLoading = true;
    fetchWeather().then(() => { weatherLoading = false; renderHeaderWeather(); });
  }
  if(!weatherData || !weatherData.current){ btn.classList.remove('show'); return; }
  const info = weatherInfo(weatherData.current.weather_code);
  btn.classList.add('show');
  btn.innerHTML = `${info.icon()}<span>${Math.round(weatherData.current.temperature_2m)}°</span><span class="hw-loc">${escapeHtml(weatherLocation.name)}</span>`;
}

function renderNotifBtn(){

  if(!btn) return;
  if(!pushSupported){ btn.style.display='none'; return; }
  btn.style.display = 'inline-flex';
  btn.classList.toggle('subscribed', pushSubscribed);
  btn.innerHTML = pushBusy ? spinnerIcon() : (pushSubscribed ? bellIcon() : bellOffIcon());

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const arr = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) arr[i] = rawData.charCodeAt(i);
  return arr;
}
async function initPush(){
  if(!pushSupported) return;
  try{
    const reg = await navigator.serviceWorker.register('./sw.js');
    const sub = await reg.pushManager.getSubscription();
    pushSubscribed = !!sub;
  } catch(e){
    console.error('[push] no se pudo registrar el service worker:', e);
    pushSupported = false;
  }
  renderNotifBtn();
}
async function togglePush(){
  if(!pushSupported){ showToast('Este navegador no soporta notificaciones push. En iPhone, añade la app a la pantalla de inicio primero.'); return; }
  if(pushBusy) return;
  pushBusy = true; renderNotifBtn();
  try{
    const reg = await navigator.serviceWorker.ready;
    if(pushSubscribed){
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        const res = await fetch('./push.php?action=unsubscribe', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ endpoint: sub.endpoint }) });
        if(!res.ok) throw new Error('El servidor no pudo cancelar la suscripción (¿sesión caducada?)');
        await sub.unsubscribe();
      }
      pushSubscribed = false;
      showToast('Avisos push desactivados.');
    } else {
      if(location.protocol !== 'https:'){ throw new Error('Los avisos push necesitan HTTPS. Esta página no se está sirviendo por HTTPS.'); }
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ throw new Error('No has dado permiso de notificaciones en el navegador.'); }
      const keyRes = await fetch('./push.php?action=vapid_public_key');
      if(!keyRes.ok) throw new Error('No se pudo obtener la clave del servidor (revisa push.php y config.php).');
      const { key } = await keyRes.json();
      if(!key) throw new Error('El servidor no devolvió una clave VAPID válida.');
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
      const subRes = await fetch('./push.php?action=subscribe', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(sub.toJSON()) });
      if(!subRes.ok) throw new Error('No se pudo guardar la suscripción en el servidor.');
      pushSubscribed = true;
      showToast('Avisos push activados correctamente.');
    }
  } catch(e){
    console.error('[push] error:', e);
    showToast('No se pudo activar/desactivar: ' + e.message);
  } finally {
    pushBusy = false;
    renderNotifBtn();
  }
}
function showToast(msg, action){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:calc(var(--toast-b,24px) + var(--safe-b));transform:translateX(-50%);width:max-content;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13.5px;max-width:88vw;text-align:center;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:14px;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  if(action){
    const b = document.createElement('button');
    b.textContent = action.label;
    b.style.cssText = 'background:none;border:none;color:var(--lav-ink);font-weight:700;font-size:13.5px;cursor:pointer;padding:0;';
    b.onclick = () => { t.style.opacity = '0'; t.style.pointerEvents = 'none'; action.fn(); };

}

function dueBadge(due_at, done){
  if(!due_at) return null;
  const now=new Date(), due=new Date(due_at.replace(' ','T')+'Z'); const diffH=(due-now)/3600000;
  let cls, label;
  if(!done && diffH<0){ cls='overdue'; label='venció ' + fmtDate(due); }
  else if(diffH<24){ cls='soon'; label = diffH<1 ? 'vence en '+Math.max(1,Math.round(diffH*60))+' min' : 'vence en '+Math.round(diffH)+' h'; }
  else if(diffH<48){ cls='today'; label='vence mañana'; }
  else { cls='later'; label='vence '+fmtDate(due); }
  return `<span class="due ${cls}">${label}</span>`;
}

function renderCalendario(){
  const el = document.getElementById('calendarioMain'); if(!el) return;

  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;        // lunes = 0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const gridStart = new Date(year, month, 1 - startOffset);
  const byDate = {};
  tasks.forEach(t => { const k = taskDateKey(t); if(k) (byDate[k] = byDate[k] || []).push(t); });
  const todayKey = dateKey(new Date());
  const catColor = t => { const i = categories.findIndex(c => c.id == t.category_id); return i >= 0 ? colorFor(i) : {bg:'#EDEAE4', ink:'#928F8A'}; };
  let cells = '';
  for(let i=0;i<totalCells;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const k = dateKey(d);
    const dayTasks = (byDate[k] || []).slice().sort((a,b) => dueMs(a)-dueMs(b));
    const chips = dayTasks.slice(0,3).map(t => { const c = catColor(t); return `<div class="cal-chip${t.done?' done':''}" style="background:${c.bg};color:${c.ink}">${escapeHtml(t.text)}</div>`; }).join('');

    cells += `<div class="cal-cell${d.getMonth()!==month?' other':''}${k===todayKey?' today':''}${k===calSelected?' selected':''}" data-date="${k}">
      <div class="cal-num">${d.getDate()}</div><div class="cal-chips">${chips}${more}</div><div class="cal-dots">${dots}</div></div>`;
  }
  el.innerHTML = `

      </div>
      <aside class="cal-panel" id="calPanel"></aside>
    </div>`;
  document.getElementById('calPrev').onclick = () => { calendarMonth = new Date(year, month-1, 1); renderCalendario(); };
  document.getElementById('calNext').onclick = () => { calendarMonth = new Date(year, month+1, 1); renderCalendario(); };
  document.getElementById('calToday').onclick = () => { calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); calSelected = dateKey(new Date()); renderCalendario(); };
  document.getElementById('calNew').onclick = () => openTaskModal(calSelected);
  document.querySelectorAll('#calGrid .cal-cell').forEach(cell => {
    cell.onclick = () => {

      renderCalendario();
      if(window.innerWidth <= 1100) document.getElementById('calPanel').scrollIntoView({ behavior:'smooth', block:'nearest' });
    };

function parseServerDate(iso){
  if(!iso) return null;
  // Fechas que vienen del servidor: "2024-01-01 12:00:00" (sin T ni Z).
  // Fechas ya en formato ISO (con T): las dejamos tal cual, sin añadir una Z de más.
  if(iso.includes(' ') && !iso.includes('T')) return new Date(iso.replace(' ','T')+'Z');
  return new Date(iso);
}
function noteRelDate(iso){
  if(!iso) return '';
  const d = parseServerDate(iso); const now = new Date();
  if(!d || isNaN(d.getTime())) return '';
  const sameDay = d.toDateString() === now.toDateString();
  if(sameDay) return d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const diffDays = Math.round((now - d) / 86400000);
  if(diffDays < 7) return d.toLocaleDateString('es-ES',{weekday:'short'});
  return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}

/* Texto de la vista previa de la lista: sin símbolos de Markdown ni etiquetas HTML */
function noteSnippet(n){
  for(const raw of String(n.content || '').split('\n')){
    if(/^\s*```/.test(raw)) continue;
    const t = raw
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' [imagen] ')
      .replace(/<img[^>]*>/gi, ' [imagen] ')
      .replace(/<[^>]+>/g, ' ')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/^[\s>#*+\-|:]+/, '')
      .replace(/[*_~`|]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if(t) return t.slice(0, 80);
  }
  return '';
}

/* ---- Edición sobre el textarea ---- */
function taEdit(fn){
  const ta = document.getElementById('noteContentInput');
  if(!ta || ta.readOnly) return;
  const r = fn(ta.value, ta.selectionStart, ta.selectionEnd);
  ta.value = r.value;
  ta.focus();
  ta.setSelectionRange(r.start, r.end);
  ta.dispatchEvent(new Event('input', { bubbles: true }));     // dispara el autoguardado
}
function fmtWrap(before, after, placeholder){
  taEdit((v, s, e) => {
    const sel = v.slice(s, e) || placeholder;
    return { value: v.slice(0, s) + before + sel + after + v.slice(e), start: s + before.length, end: s + before.length + sel.length };
  });
}
const ANY_LIST = /^(?:[-*+]|\d+\.)\s/;
function fmtLines(prefixFor, detect, replaceRe){       // alterna el prefijo en todas las líneas seleccionadas
    replaceRe = replaceRe || detect;                    // en las listas, al cambiar de tipo se sustituye el marcador anterior
  taEdit((v, s, e) => {
    if(e > s && v[e - 1] === '\n') e -= 1;
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    let le = v.indexOf('\n', e); if(le < 0) le = v.length;
    const lines = v.slice(ls, le).split('\n');
    const allHave = lines.every(l => detect.test(l));
    const out = lines.map((l, i) => allHave ? l.replace(detect, '') : prefixFor(i) + l.replace(replaceRe, ''));
    const block = out.join('\n');
    return { value: v.slice(0, ls) + block + v.slice(le), start: ls, end: ls + block.length };
  });
}
function fmtInsert(text){                   // inserta un bloque en su propio párrafo
  taEdit((v, s, e) => {
    const before = v.slice(0, s), after = v.slice(e);
    const pre = before && !before.endsWith('\n') ? '\n\n' : (before && !before.endsWith('\n\n') ? '\n' : '');
    const post = after && !after.startsWith('\n') ? '\n\n' : '';
    const pos = s + pre.length + text.length;
    return { value: before + pre + text + post + after, start: pos, end: pos };
  });
}
function fmtCode(){
  taEdit((v, s, e) => {
    const sel = v.slice(s, e);
    if(sel.includes('\n')){ const block = '```\n' + sel + '\n```'; return { value: v.slice(0, s) + block + v.slice(e), start: s + 4, end: s + 4 + sel.length }; }
    const t = sel || 'código';
    return { value: v.slice(0, s) + '`' + t + '`' + v.slice(e), start: s + 1, end: s + 1 + t.length };
  });
}
function fmtLink(){
  taEdit((v, s, e) => {
    const sel = v.slice(s, e), text = sel || 'texto del enlace', url = 'https://';
    const start = sel ? s + text.length + 3 : s + 1;
    return { value: v.slice(0, s) + '[' + text + '](' + url + ')' + v.slice(e), start, end: sel ? start + url.length : start + text.length };
  });
}

/* ---- Imágenes: se reducen en el navegador antes de subirlas ---- */
async function loadBitmap(file){
  if(window.createImageBitmap){ try{ return await createImageBitmap(file); } catch(e){} }
  return await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}
async function compressImage(file){
  const MAX = 1600, LIMIT = 3 * 1024 * 1024;
  if(file.type === 'image/gif'){                        // un GIF se sube tal cual (si se redibuja pierde la animación)
    if(file.size > LIMIT) throw new Error('El GIF pesa demasiado (máx. 3 MB).');
    return file;
  }
  const bmp = await loadBitmap(file);
  const w0 = bmp.width, h0 = bmp.height;
  if((file.type === 'image/png' || file.type === 'image/webp') && file.size <= 600 * 1024 && Math.max(w0, h0) <= MAX) return file;   // capturas pequeñas: sin tocar
  let scale = Math.min(1, MAX / Math.max(w0, h0)), quality = 0.85;
  for(let attempt = 0; attempt < 4; attempt++){
    const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);   // fondo blanco: el JPEG no tiene transparencia
    ctx.drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    if(blob && blob.size <= LIMIT) return blob;
    scale *= 0.75; quality = 0.7;
  }
  throw new Error('No se pudo reducir la imagen lo suficiente.');
}
async function uploadNoteImage(file){
  const note = notes.find(n => n.id === activeNoteId);
  if(!note || note.access === 'view') return;
  if(!/^image\//.test(file.type)){ showToast('Ese archivo no es una imagen.'); return; }
  const ind = document.getElementById('noteSaveIndicator');
  try{
    if(ind) ind.textContent = 'Subiendo imagen…';
    const blob = await compressImage(file);
    const res = await fetch(API_BASE + '?resource=note_image&note_id=' + note.id, { method:'POST', headers:{ 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
    if(res.status === 401){ me = null; render(); return; }
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || ('Error ' + res.status));
    if(activeNoteId === note.id && richEditor && document.getElementById('noteRich')) richEditor.insertImage(data.url);
    else if(activeNoteId === note.id && document.getElementById('noteContentInput')) fmtInsert('![imagen](' + data.url + ')');
    else showToast('Imagen subida, pero ya no estabas editando esa nota.');
    if(ind && ind.textContent === 'Subiendo imagen…') ind.textContent = '';
  } catch(e){
    if(ind) ind.textContent = '';
    showToast('No se pudo subir la imagen: ' + e.message);
  }
}

/* Autoguardado: los guardados se encadenan (nunca dos a la vez) para que la fecha de
   versión que se envía como base sea siempre la de la última respuesta del servidor. */
let noteSaveChain = Promise.resolve(), pendingNoteId = null;
function scheduleNoteSave(id){
  const indicator = document.getElementById('noteSaveIndicator');
  if(indicator) indicator.textContent = 'Escribiendo…';
  pendingNoteId = id;
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(() => {
    noteSaveTimer = null;
    const nid = pendingNoteId; pendingNoteId = null;
    noteSaveChain = noteSaveChain.then(() => saveNoteNow(nid));
  }, 700);
}
async function flushNoteSave(){
  if(noteSaveTimer){
    clearTimeout(noteSaveTimer); noteSaveTimer = null;
    const nid = pendingNoteId; pendingNoteId = null;
    if(nid !== null) noteSaveChain = noteSaveChain.then(() => saveNoteNow(nid));
  }
  await noteSaveChain;
}
async function saveNoteNow(id){
  const note = notes.find(n => n.id === id);
  if(!note || note.access === 'view' || activeNoteId !== id) return;
  const titleInput = document.getElementById('noteTitleInput');
  const contentInput = document.getElementById('noteContentInput');
  if(!titleInput) return;
  const title = titleInput.value;
  let content = note.content;
  if(contentInput) content = contentInput.value;
  else if(richEditor && noteContentDirty && document.getElementById('noteRich') === richEditor.host) content = richEditor.getMarkdown();
  noteContentDirty = false;
  const indicator = document.getElementById('noteSaveIndicator');
  note.title = title; note.content = content;
  try{
    const j = await api('?resource=notes&id='+id, { method:'PATCH', body: JSON.stringify({ title, content, base_updated_at: note.updated_at }) });
    note.updated_at = j.updated_at;
    if(indicator) indicator.textContent = 'Guardado';
    sortNotes();
    // Solo refrescamos la lista lateral: nunca el cuadro de texto donde se sigue escribiendo.
    renderNotesListPane();
  } catch(e){
    if(e.status === 409){
      try{ await resolveNoteConflict(note, title, content, e.data && e.data.updated_at); }
      catch(e2){ if(indicator) indicator.textContent = 'Error al guardar'; }
    } else if(indicator) indicator.textContent = 'Error al guardar';
  }
}
async function resolveNoteConflict(note, title, content, serverUpdatedAt){
  const overwrite = confirm('Otra persona ha guardado cambios en esta nota mientras la editabas.\n\nAceptar: guardar tu versión (sobrescribe la suya).\nCancelar: cargar su versión (pierdes tus cambios).');
  const indicator = document.getElementById('noteSaveIndicator');
  if(overwrite){
    const j = await api('?resource=notes&id='+note.id, { method:'PATCH', body: JSON.stringify({ title, content, base_updated_at: serverUpdatedAt }) });
    note.updated_at = j.updated_at;
    if(indicator) indicator.textContent = 'Guardado';
    sortNotes(); renderNotesListPane();
  } else {
    const data = await api('?resource=all');
    notes = data.notes || []; myGroups = data.my_groups || [];
    renderNotas();
  }
}
async function togglePinNote(id){
  const note = notes.find(n => n.id === id); if(!note) return;
  note.pinned = !note.pinned;
  try{ await api('?resource=notes&id='+id, { method:'PATCH', body: JSON.stringify({ pinned: note.pinned }) }); }
  catch(e){ note.pinned = !note.pinned; showToast('No se pudo fijar la nota.'); }
  sortNotes();
  renderNotas();
}
async function deleteNote(id){
  const note = notes.find(n => n.id === id);
  if(note && note.share_count > 0 && !confirm(`Esta nota está compartida con ${note.share_count} ${note.share_count === 1 ? 'destinatario' : 'destinatarios'}. Si la eliminas, dejarán de verla.\n\n¿Eliminar?`)) return;
  await flushNoteSave();
  await api('?resource=notes&id='+id, { method:'DELETE' });
  notes = notes.filter(n => n.id !== id);
  if(activeNoteId === id){ activeNoteId = null; mobileShowingEditor = false; }
  renderNotas();
}

function frenchPayment(principal, tae, months){
  const r = (tae/100)/12;
  if(!months || months<=0 || principal<=0) return 0;
  if(r === 0) return principal/months;
  const f = Math.pow(1+r, months);
  return principal * r * f / (f-1);
}

/* ---- Vista por meses: un bloque por mes con sus totales y el saldo acumulado ---- */
function monthKey(d){ return String(d || '').slice(0, 7); }
function monthLabel(key){
  const [y, mo] = key.split('-').map(Number);
  const t = new Date(y, mo - 1, 1).toLocaleDateString('es-ES', { month:'long', year:'numeric' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const signedMoney = v => (v > 0 ? '+' : '') + money(v);
function renderMonthsView(list, visible){
  const groups = new Map();
  visible.forEach(m => {
    const k = monthKey(m.date);
    if(!groups.has(k)) groups.set(k, { gasto:0, ingreso:0, items:[] });
    const g = groups.get(k); g[m.type] += Number(m.amount); g.items.push(m);
  });
  const keys = [...groups.keys()].sort().reverse();
  // Saldo acumulado a fin de cada mes: se calcula con TODOS los movimientos y solo se muestra sin filtros
  const noFilters = finFilterType === 'all' && finFilterCat === 'all';
  const net = {};
  movements.forEach(m => { const k = monthKey(m.date); net[k] = (net[k] || 0) + (m.type === 'gasto' ? -Number(m.amount) : Number(m.amount)); });
  const cum = {}; let run = 0;
  Object.keys(net).sort().forEach(k => { run += net[k]; cum[k] = run; });
  if(!monthsInit){ monthsInit = true; monthsOpen = new Set(keys.slice(0, 1)); }

  keys.forEach(k => {
    const g = groups.get(k), bal = g.ingreso - g.gasto;
    const card = document.createElement('div');
    card.className = 'month-group' + (monthsOpen.has(k) ? ' open' : '');
    card.innerHTML = `
      <button type="button" class="month-head">
        <span class="mh-top"><span class="mh-title">${escapeHtml(monthLabel(k))}</span><span class="mh-count">${g.items.length} ${g.items.length === 1 ? 'movimiento' : 'movimientos'}</span><span class="chevron">${chevronSvg()}</span></span>
        <span class="mh-stats">
          <span class="mh-stat i"><small>Ingresos</small>${money(g.ingreso)}</span>
          <span class="mh-stat g"><small>Gastos</small>${money(g.gasto)}</span>
          <span class="mh-stat b"><small>Balance</small>${signedMoney(bal)}</span>
        </span>
        ${noFilters ? `<span class="mh-sub">Saldo acumulado a fin de mes: <strong>${money(cum[k])}</strong></span>` : ''}
      </button>
      <div class="month-body"></div>`;
    const body = card.querySelector('.month-body');
    const fill = () => { if(!body.dataset.built){ body.dataset.built = '1'; g.items.forEach(m => body.appendChild(buildMovRow(m))); } };
    if(monthsOpen.has(k)) fill();
    card.querySelector('.month-head').onclick = () => {
      const open = !monthsOpen.has(k);
      if(open){ monthsOpen.add(k); fill(); } else monthsOpen.delete(k);
      card.classList.toggle('open', open);
    };
    list.appendChild(card);
  });
}
