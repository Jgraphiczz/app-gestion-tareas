<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F6F9">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var p=localStorage.getItem('theme')||'auto',r=document.documentElement;r.dataset.themePref=p;if(p!=='auto')r.dataset.theme=p;var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name=theme-color]').content=d?'#08090D':'#F5F6F9';}catch(e){}})();</script>
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>App Gestión Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F9; --card:#FFFFFF; --ink:#0E1118; --ink-soft:#6A7282; --line:#E4E7EE;
    --font-display:'Geist', 'Inter', -apple-system, sans-serif;
    --font-body:'Geist', 'Inter', -apple-system, sans-serif;
    --font-mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --radius:16px; --radius-sm:12px;
    --shadow:0 0 0 1px var(--line), 0 1px 2px rgba(14,17,24,.04), 0 10px 28px -14px rgba(14,17,24,.14);
    --lav:#ECEBFF; --lav-ink:#5B54E0; --mint:#DAF5EA; --mint-ink:#0F8F66;
    --peach:#FFEAD3; --peach-ink:#C2640E; --rose:#FFE1E9; --rose-ink:#D03A68;
    --sky:#DDEEFF; --sky-ink:#1B6CC8; --butter:#FBF2C9; --butter-ink:#94760A;
    --primary:#5B5CF0; --primary-soft:var(--lav);
    --grad:linear-gradient(135deg,#5B5CF0 0%,#8B5CF6 100%);
    --glow:0 10px 30px -8px rgba(91,92,240,.55);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --toast-b:24px; --glass:rgba(245,246,249,.8); --danger-bg:#F6C6C6; --danger-ink:#B03A3A;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#08090D; --card:#11131A; --ink:#E9ECF3; --ink-soft:#8A93A5; --line:#1E222D;
    --shadow:0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.7);
    --lav:#1F2046; --lav-ink:#A9ABFF; --mint:#0D2B22; --mint-ink:#5FE0B1;
    --peach:#35220F; --peach-ink:#FFB86B; --rose:#381522; --rose-ink:#FF8FB1;
    --sky:#0F2639; --sky-ink:#7EC1FF; --butter:#2E2A0E; --butter-ink:#F0D95C;
    --primary:#8D8EFF; --primary-soft:var(--lav);
    --grad:linear-gradient(135deg,#6D6EFF 0%,#9B6CFF 100%);
    --glow:0 10px 34px -8px rgba(124,108,255,.6);
    --glass:rgba(8,9,13,.78); --danger-bg:#4A1D24; --danger-ink:#FF9C9C;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
    --bg:#08090D; --card:#11131A; --ink:#E9ECF3; --ink-soft:#8A93A5; --line:#1E222D;
    --shadow:0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.7);
    --lav:#1F2046; --lav-ink:#A9ABFF; --mint:#0D2B22; --mint-ink:#5FE0B1;
    --peach:#35220F; --peach-ink:#FFB86B; --rose:#381522; --rose-ink:#FF8FB1;
    --sky:#0F2639; --sky-ink:#7EC1FF; --butter:#2E2A0E; --butter-ink:#F0D95C;
    --primary:#8D8EFF; --primary-soft:var(--lav);
    --grad:linear-gradient(135deg,#6D6EFF 0%,#9B6CFF 100%);
    --glow:0 10px 34px -8px rgba(124,108,255,.6);
    --glass:rgba(8,9,13,.78); --danger-bg:#4A1D24; --danger-ink:#FF9C9C;
    color-scheme:dark;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-0.01em;}
  button,input,select{font-family:inherit;}
  a{color:inherit;}

  /* ===== Auth screen ===== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:32px 28px;width:100%;max-width:380px;}
  .auth-card h1{font-size:24px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .auth-card h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);}
  .auth-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;}
  .auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px;}
  .auth-tab{flex:1;padding:9px;border:none;background:none;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .auth-tab.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .auth-field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:16px;background:var(--bg);color:var(--ink);}
  .auth-field input:focus{outline:none;border-color:var(--primary);}
  .auth-btn{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;}
  .auth-btn:disabled{opacity:.6;}
  .auth-error{background:var(--rose);color:var(--rose-ink);padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}

  /* ===== Shell ===== */
  #shell{display:flex;min-height:100vh;}
  .side{
    width:220px;flex-shrink:0;display:flex;flex-direction:column;padding:22px 14px;
    border-right:1px solid var(--line);
  }
  .side .brand{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;padding:0 8px 22px;}
  .side .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);}
  .navlist{display:flex;flex-direction:column;gap:3px;flex:1;}
  .navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-sm);border:none;background:none;color:var(--ink-soft);font-size:14.5px;font-weight:600;cursor:pointer;text-align:left;}
  .navbtn:hover{background:var(--card);color:var(--ink);}
  .navbtn.active{background:var(--primary-soft);color:var(--primary);}
  .navbtn .ic{font-size:17px;width:20px;text-align:center;}
  .navbtn .ic svg,.mobilenav .ic svg{width:19px;height:19px;display:block;}
  .pinned svg{width:15px;height:15px;flex-shrink:0;vertical-align:-3px;margin-right:2px;}
  .icon-toggle svg{width:18px;height:18px;}
  #notifBtn svg{width:16px;height:16px;display:block;}
  .drawer-item svg{width:17px;height:17px;flex-shrink:0;}
  .notif-toggle{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
    transition:background .15s,color .15s;padding:0;
  }
  .notif-toggle:hover{color:var(--primary);}
  [data-theme-toggle] svg{width:18px;height:18px;display:none;}
  html[data-theme-pref="auto"] [data-theme-toggle] .th-auto,html:not([data-theme-pref]) [data-theme-toggle] .th-auto,html[data-theme-pref="light"] [data-theme-toggle] .th-light,html[data-theme-pref="dark"] [data-theme-toggle] .th-dark{display:block;}
  .notif-toggle.subscribed{color:var(--primary);background:var(--primary-soft);border-color:var(--primary);}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .content{flex:1;min-width:0;display:flex;flex-direction:column;}
  .app-header{
    display:flex;align-items:center;gap:12px;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:40;
  }
  .app-header .menu-btn{display:none;}
  .app-header h1{font-size:18px;}
  .app-header .spacer{flex:1;}
  .header-weather{display:none;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:6px 12px 6px 8px;border-radius:20px;cursor:pointer;margin-right:8px;}
  .header-weather.show{display:flex;}
  .header-weather svg{width:18px;height:18px;color:var(--sky-ink);}
  .header-weather .hw-loc{color:var(--ink-soft);font-weight:500;font-size:11.5px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar{display:none;}

  .section{display:none;flex:1;}
  .section.active{display:flex;}

  /* ===== Tareas ===== */
  #section-tareas{width:100%;}
  .tsidebar{width:230px;flex-shrink:0;padding:20px 14px;border-right:1px solid var(--line);}
  .pinned{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--radius-sm);background:none;border:none;color:var(--ink-soft);font-size:14px;cursor:pointer;text-align:left;margin-bottom:8px;width:100%;}
  .pinned:hover{background:var(--bg);color:var(--ink);}
  .pinned.active{background:var(--butter);color:var(--butter-ink);font-weight:600;}
  .divider{height:1px;background:var(--line);margin:4px 4px 10px;}
  .tabs{display:flex;flex-direction:column;gap:2px;}
  .tab{position:relative;text-align:left;background:none;border:none;border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;color:var(--ink-soft);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .tab:hover{background:var(--bg);color:var(--ink);}
  .tab.active{color:var(--ink);background:var(--bg);font-weight:600;}
  .tab-label{display:flex;align-items:center;gap:9px;min-width:0;}
  .tab-label .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .tab .count{font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--card);border-radius:20px;padding:2px 7px;flex-shrink:0;}
  .tab.active .count{background:var(--primary-soft);color:var(--primary);}
  .tab .cat-del{display:none;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:2px;flex-shrink:0;}
  .tab:hover .cat-del{display:flex;}
  .tab .cat-del:hover{color:var(--rose-ink);}
  .new-cat{margin-top:10px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);background:none;color:var(--ink-soft);font-size:13.5px;cursor:pointer;text-align:left;width:100%;}
  .new-cat:hover{border-color:var(--primary);color:var(--primary);}

  .inline-form{margin-top:8px;display:flex;gap:6px;}
  .inline-form input,.inline-form select{flex:1;padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--card);color:var(--ink);min-width:0;}
  .inline-form input:focus,.inline-form select:focus{outline:none;border-color:var(--primary);}
  .inline-form button{padding:0 12px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
  .inline-form button.cancel{background:none;color:var(--ink-soft);}

  .main{flex:1;padding:24px 32px 40px;max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;min-width:0;}
  .main-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .swatch-lg{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
  .main-header h2{font-size:22px;}
  .main-header .sub{font-size:13px;color:var(--ink-soft);margin-left:auto;white-space:nowrap;}

  .add-bar{display:flex;gap:8px;margin-bottom:6px;background:var(--card);padding:6px;border-radius:var(--radius);box-shadow:var(--shadow);}
  .add-bar input[type=text]{flex:1;padding:11px 12px;border:none;background:none;font-size:16px;color:var(--ink);min-width:0;}
  .add-bar input:focus{outline:none;}
  .icon-toggle{width:38px;flex-shrink:0;border:none;background:none;border-radius:var(--radius-sm);color:var(--ink-soft);cursor:pointer;font-size:17px;}
  .icon-toggle.on{background:var(--primary-soft);color:var(--primary);}
  .add-bar button.save{padding:0 18px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;}
  .add-bar button.save:disabled{opacity:.5;}

  .due-panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:6px 0 16px;display:flex;flex-direction:column;gap:10px;}
  .due-panel label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .due-panel input[type=datetime-local]{padding:8px 10px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--ink);width:100%;}
  .reminder-opts{display:flex;flex-wrap:wrap;gap:8px;}
  .reminder-opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);background:var(--bg);padding:7px 12px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;}
  .reminder-opt.checked{background:var(--sky);color:var(--sky-ink);border-color:var(--sky-ink);}
  .reminder-opt input{display:none;}

  .tag-picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 16px;}
  .chip{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip.add-chip{border-style:dashed;background:none;}
  .chip.ghost{background:none;border:none;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px;}
  .chip .x{cursor:pointer;opacity:.7;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
  .tag-form-wrap{margin-bottom:16px;}
  .active-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;padding:9px 10px;background:var(--butter);border-radius:var(--radius-sm);}
  .active-filters .af-label{font-size:11.5px;color:var(--butter-ink);font-weight:700;margin-right:2px;}
  .filter-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;background:var(--card);color:var(--ink);font-size:12px;font-weight:600;border:1.5px solid var(--butter-ink);}
  .filter-chip .x{cursor:pointer;opacity:.6;display:flex;}
  .filter-chip .x:hover{opacity:1;}
  .filter-chip .x svg{width:11px;height:11px;}
  .reset-filters-btn{margin-left:auto;background:none;border:none;color:var(--butter-ink);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

  .list{display:flex;flex-direction:column;gap:9px;}
  .task{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:flex-start;gap:13px;}
  .box{width:23px;height:23px;border:2px solid var(--line);border-radius:50%;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .box svg{display:none;width:12px;height:12px;}
  .task.done .box{background:var(--mint-ink);border-color:var(--mint-ink);}
  .task.done .box svg{display:block;}
  .task-body{flex:1;min-width:0;padding-top:1px;}
  .task-text{font-size:15px;line-height:1.4;word-break:break-word;}
  .task.done .task-text{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line);}
  .task-meta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .task-meta span{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .task-meta .tagname{color:var(--primary);background:var(--primary-soft);}
  .due.soon{background:var(--rose);color:var(--rose-ink);}
  .due.today{background:var(--peach);color:var(--peach-ink);}
  .due.later{background:var(--sky);color:var(--sky-ink);}
  .due.overdue{background:var(--danger-bg);color:var(--danger-ink);}
  .task-del{background:none;border:none;color:var(--line);cursor:pointer;padding:5px;flex-shrink:0;border-radius:6px;}
  .task-del:hover{color:var(--rose-ink);background:var(--rose);}
  .task-del svg{width:15px;height:15px;display:block;}

  .empty{padding:44px 20px;text-align:center;color:var(--ink-soft);font-size:14px;background:var(--card);border-radius:var(--radius);}
  .empty .emoji{font-size:30px;display:block;margin-bottom:8px;}
  .empty strong{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px;font-family:var(--font-display);}

  /* ===== FAB (nueva tarea) ===== */
  .fab{
    position:fixed;bottom:28px;right:28px;width:56px;height:56px;border-radius:50%;
    background:var(--primary);color:#fff;border:none;box-shadow:0 6px 18px rgba(125,107,176,.4);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:45;
    transition:transform .12s ease;
  }
  .fab:hover{transform:scale(1.05);}
  .fab:active{transform:scale(.95);}
  .fab svg{width:24px;height:24px;}

  /* ===== Modal (bottom-sheet en móvil, tarjeta centrada en escritorio) ===== */
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(58,58,60,.35);z-index:100;}
  .modal-backdrop.open{display:block;}
  .modal-sheet{
    display:none;position:fixed;z-index:101;background:var(--card);
    left:50%;top:50%;transform:translate(-50%,-50%);
    width:100%;max-width:440px;max-height:85vh;border-radius:var(--radius);
    box-shadow:0 20px 50px rgba(0,0,0,.2);flex-direction:column;overflow:hidden;
  }
  .modal-sheet.open{display:flex;}
  .modal-handle{display:none;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .modal-header h3{font-size:16px;}
  .modal-close{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;}
  .modal-close svg{width:16px;height:16px;display:block;}
  .modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
  .modal-body label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .modal-field input,.modal-field textarea,.modal-field select,
  .modal-body input[type=text],.modal-body textarea,.modal-body select{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
    font-size:15px;background:var(--bg);color:var(--ink);margin-top:5px;
  }
  .modal-field input:focus,.modal-field textarea:focus,.modal-field select:focus,
  .modal-body input:focus,.modal-body textarea:focus,.modal-body select:focus{outline:none;border-color:var(--primary);}
  .modal-body textarea{resize:vertical;min-height:64px;font-family:inherit;}
  .modal-field{display:flex;flex-direction:column;}
  .modal-collapse-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:10px 0;border-top:1px solid var(--line);margin-top:2px;}
  .modal-collapse-toggle span.label{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .modal-collapse-toggle span.label svg{width:15px;height:15px;flex-shrink:0;}
  svg:not([width]){width:1em;height:1em;}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;}

  .setup-banner{background:var(--butter);border:1.5px solid #E4D67F;color:#7A6A1E;border-radius:var(--radius);padding:16px 18px;font-size:13.5px;line-height:1.5;max-width:480px;margin:60px auto;}
  .setup-banner code{background:#00000010;padding:1px 5px;border-radius:4px;}

  /* ===== Diagramas ===== */
  .diagram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .diagram-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;}
  .diagram-thumb{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .diagram-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .diagram-thumb svg{width:34px;height:34px;color:var(--ink-soft);opacity:.5;}
  .diagram-info{padding:11px 14px 13px;}
  .diagram-info .dtitle{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .diagram-info .dmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .diagram-card .diagram-del{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);border:none;border-radius:8px;padding:6px;cursor:pointer;color:var(--ink-soft);display:flex;box-shadow:var(--shadow);}
  .diagram-card .diagram-del:hover{color:var(--rose-ink);}
  .diagram-card .diagram-del svg{width:15px;height:15px;}
  .diagram-overlay{display:none;position:fixed;inset:0;z-index:120;background:var(--card);flex-direction:column;}
  .diagram-overlay.open{display:flex;}
  .diagram-topbar{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 14px 8px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--card);}
  .diagram-topbar input{flex:1;min-width:0;border:none;background:none;font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);padding:6px 4px;}
  .diagram-topbar input:focus{outline:none;}
  .diagram-canvas{flex:1;min-height:0;position:relative;padding-bottom:var(--safe-b);}
  .diagram-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13.5px;}

  /* ===== Notas con formato ===== */
  .fmt-bar{display:flex;align-items:center;gap:2px;padding:6px 14px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .fmt-bar::-webkit-scrollbar{display:none;}
  .fmt-btn{min-width:34px;height:34px;padding:0 6px;border:none;background:none;border-radius:8px;color:var(--ink-soft);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-body);}
  .fmt-btn:hover{background:var(--bg);color:var(--ink);}
  .fmt-btn:active{background:var(--primary-soft);color:var(--primary);}
  .fmt-btn svg{width:18px;height:18px;}
  .fmt-sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex-shrink:0;}
  .note-tool-btn.active-mode{background:var(--primary-soft);color:var(--primary);}
  /* contain:paint + isolation: lo que escriba una nota (también las compartidas) no puede salirse de su caja ni tapar la app */
  .note-rendered{flex:1;min-height:0;overflow:auto;contain:paint;isolation:isolate;position:relative;font-size:15px;line-height:1.65;color:var(--ink);overflow-wrap:anywhere;}
  .note-rendered > :first-child{margin-top:0;}
  .note-rendered h1,.note-rendered h2,.note-rendered h3,.note-rendered h4{font-family:var(--font-display);line-height:1.25;margin:1.1em 0 .4em;}
  .note-rendered h1{font-size:1.5em;} .note-rendered h2{font-size:1.25em;} .note-rendered h3{font-size:1.1em;}
  .note-rendered p{margin:.6em 0;}
  .note-rendered ul,.note-rendered ol{padding-left:1.4em;margin:.6em 0;}
  .note-rendered blockquote{margin:.8em 0;padding:.2em 1em;border-left:3px solid var(--lav);color:var(--ink-soft);background:rgba(125,107,176,.09);border-radius:0 8px 8px 0;}
  .note-rendered code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:rgba(125,107,176,.12);padding:1px 6px;border-radius:5px;}
  .note-rendered pre{background:rgba(125,107,176,.09);padding:12px 14px;border-radius:10px;overflow-x:auto;margin:.8em 0;}
  .note-rendered pre code{background:none;padding:0;}
  .note-rendered table{border-collapse:collapse;margin:.8em 0;max-width:100%;}
  .note-rendered th,.note-rendered td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top;}
  .note-rendered th{background:rgba(125,107,176,.09);font-weight:700;}
  .note-rendered img{max-width:100%;height:auto;border-radius:10px;display:block;margin:.6em 0;}
  .note-rendered a{color:var(--primary);text-decoration:underline;text-underline-offset:2px;}
  .note-rendered hr{border:none;border-top:1px solid var(--line);margin:1.2em 0;}
  .note-rendered mark{background:var(--butter);padding:0 3px;border-radius:3px;}
  .note-rendered kbd{font-family:inherit;font-size:.85em;background:rgba(125,107,176,.09);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;}
  .note-rendered summary{cursor:pointer;font-weight:600;}
  .note-empty{color:var(--ink-soft);font-size:14px;margin:0;}
  .fmt-help p{font-size:13.5px;line-height:1.55;margin:0 0 10px;}
  .fmt-help-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px;}
  .fmt-help-table td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  .fmt-help code,.fmt-help kbd{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .fmt-help-warn{background:var(--rose);color:var(--rose-ink);padding:10px 12px;border-radius:10px;}
  .fmt-help-warn code{background:rgba(255,255,255,.55);}

  /* ===== Compartir ===== */
  .modal-backdrop.top{z-index:130;}
  .modal-sheet.top{z-index:131;}
  .share-section-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .share-list{display:flex;flex-direction:column;gap:6px;}
  .share-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:var(--radius-sm);padding:8px 10px;}
  .share-row .sr-ic{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .share-row .sr-ic svg{width:16px;height:16px;}
  .share-row .sr-name{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .share-row .sr-tag{font-size:10.5px;font-weight:600;background:var(--lav);color:var(--lav-ink);padding:2px 7px;border-radius:10px;margin-left:6px;}
  /* Más específico que ".modal-body select" (que fuerza ancho 100 % y margen) para que no aplaste el nombre */
  .modal-body .share-row select{width:auto;flex:0 0 auto;margin-top:0;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--card);color:var(--ink);}
  .share-row .task-del{color:var(--ink-soft);flex-shrink:0;}
  .share-row .task-del:hover{color:var(--rose-ink);}
  .share-empty{font-size:13px;color:var(--ink-soft);}
  .share-badge{display:inline-flex;margin-left:5px;color:var(--ink-soft);vertical-align:middle;}
  .share-badge.with-me{color:var(--sky-ink);}
  .share-badge svg,.note-item .ntitle .share-badge svg{width:12px;height:12px;color:inherit;}
  .shared-info{display:flex;align-items:center;gap:8px;padding:9px 20px;background:var(--sky);color:var(--sky-ink);font-size:12.5px;}
  .shared-info svg{width:15px;height:15px;flex-shrink:0;}
  .diagram-access-info{font-size:11.5px;color:var(--sky-ink);background:var(--sky);padding:3px 9px;border-radius:12px;white-space:nowrap;}
  .diagram-access-info:empty{display:none;}

  /* ===== Notas (estilo Notas de iPhone) ===== */
  #section-notas{width:100%;}
  .notes-list-pane{flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 0;}
  .notes-search{margin:0 16px 12px;position:relative;}
  .notes-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);}
  .notes-search input{width:100%;padding:9px 12px 9px 32px;border:none;background:var(--bg);border-radius:10px;font-size:14px;color:var(--ink);}
  .notes-search input:focus{outline:none;}
  .notes-new-btn{margin:0 16px 12px;display:flex;align-items:center;gap:8px;padding:10px 12px;border:none;border-radius:var(--radius-sm);background:var(--primary-soft);color:var(--primary);font-size:13.5px;font-weight:600;cursor:pointer;}
  .notes-new-btn svg{width:16px;height:16px;}
  .notes-scroll{flex:1;overflow-y:auto;padding:0 8px;}
  .note-item{
    display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    padding:10px 10px;border-radius:var(--radius-sm);margin-bottom:2px;
  }
  .note-item:hover{background:var(--bg);}
  .note-item.active{background:var(--primary-soft);}
  .note-item .ntitle{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:5px;}
  .note-item .ntitle svg{width:11px;height:11px;color:var(--butter-ink);flex-shrink:0;}
  .note-item .nmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .note-item .nsnippet{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notes-editor-pane{flex:1;display:flex;flex-direction:column;min-width:0;}
  .notes-editor-toolbar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);}
  .notes-editor-toolbar .spacer{flex:1;}
  .note-tool-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:8px;display:flex;}
  .note-tool-btn:hover{background:var(--bg);color:var(--ink);}
  .note-tool-btn.active-pin{color:var(--butter-ink);}
  .note-tool-btn svg{width:17px;height:17px;}
  .note-back-btn{display:none;}
  .note-title-input{border:none;background:none;font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .note-title-input:focus{outline:none;}
  .note-date{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .note-content-input{flex:1;border:none;background:none;resize:none;font-size:15px;line-height:1.6;color:var(--ink);font-family:var(--font-body);}
  .note-content-input:focus{outline:none;}
  .notes-empty-editor{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:14px;flex-direction:column;gap:8px;}
  .notes-empty-editor svg{width:36px;height:36px;opacity:.4;}
  .save-indicator{font-size:11.5px;color:var(--ink-soft);}

  /* ===== Movimientos: editar y vista por meses ===== */
  .seg{display:inline-flex;gap:4px;background:var(--card);box-shadow:var(--shadow);padding:4px;border-radius:12px;margin-bottom:12px;}
  .seg button{padding:7px 14px;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .seg button.active{background:var(--primary-soft);color:var(--primary);}
  .mov.editable{cursor:pointer;transition:background .12s;}
  .mov.editable:hover{background:var(--bg);}
  .mov-edit{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:6px;display:flex;flex-shrink:0;}
  .mov-edit:hover{color:var(--primary);background:var(--primary-soft);}
  .mov-edit svg{width:15px;height:15px;display:block;}
  .mov .task-del{color:var(--ink-soft);}
  .mov .task-del:hover{color:var(--rose-ink);}
  #gastosTabContent{padding-bottom:72px;}
  .month-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
  .month-head{display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;background:none;border:none;padding:14px 16px;cursor:pointer;color:var(--ink);}
  .month-head:hover{background:var(--bg);}
  .mh-top{display:flex;align-items:center;gap:10px;}
  .mh-title{font-family:var(--font-display);font-size:16px;font-weight:700;}
  .mh-count{font-size:12px;color:var(--ink-soft);margin-right:auto;}
  .month-head .chevron{display:flex;transition:transform .15s;}
  .month-group.open .month-head .chevron{transform:rotate(180deg);}
  .mh-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .mh-stat{display:flex;flex-direction:column;font-size:13.5px;font-weight:700;font-family:var(--font-display);min-width:0;}
  .mh-stat small{font-family:var(--font-body);font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .mh-stat.i{color:var(--mint-ink);} .mh-stat.g{color:var(--rose-ink);} .mh-stat.b{color:var(--lav-ink);}
  .mh-sub{font-size:12px;color:var(--ink-soft);}
  .mh-sub strong{color:var(--ink);}
  .month-body{display:none;padding:2px 12px 12px;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;}
  .month-group.open .month-body{display:flex;}
  .month-body .mov{box-shadow:none;background:var(--bg);}
  .month-body .mov.editable:hover{background:var(--line);}

  /* ===== Préstamos y fijos/nómina ===== */
  .gastos-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--shadow);width:fit-content;max-width:100%;overflow-x:auto;}
  .gastos-tab{padding:9px 16px;border:none;background:none;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .gastos-tab.active{background:var(--primary-soft);color:var(--primary);}
  .rec-list{display:flex;flex-direction:column;gap:10px;margin-bottom:80px;}
  .rec-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;position:relative;}
  .rec-card.inactive{opacity:.6;}
  .rec-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-right:30px;}
  .rec-name{font-size:14.5px;font-weight:600;}
  .rec-tag{font-size:10px;font-weight:700;background:var(--bg);color:var(--ink-soft);padding:2px 8px;border-radius:10px;margin-left:7px;text-transform:uppercase;}
  .rec-tag.done{background:var(--mint);color:var(--mint-ink);}
  .rec-amount{font-size:14.5px;font-weight:700;font-family:var(--font-display);flex-shrink:0;}
  .rec-amount.gasto{color:var(--rose-ink);} .rec-amount.ingreso{color:var(--mint-ink);}
  .rec-bar-track{height:6px;border-radius:4px;background:var(--bg);margin-top:10px;overflow:hidden;}
  .rec-bar-fill{height:100%;border-radius:4px;background:var(--primary);}
  .rec-meta{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .rec-card .task-del{position:absolute;top:12px;right:12px;}
  .rec-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
  .loan-preview{background:var(--primary-soft);color:var(--primary);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;margin-top:4px;line-height:1.5;}

  /* ===== Wide sections (Gastos, Estadísticas, Grupo, Admin) ===== */
  .wide-main{flex:1;padding:24px 28px 40px;max-width:920px;margin:0 auto;width:100%;}
  .fin-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .fin-header h2{font-size:22px;}
  .summary-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .summary-card{flex:1;min-width:150px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
  .summary-card .label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
  .summary-card .value{font-size:21px;font-weight:700;font-family:var(--font-display);}
  .summary-card .delta{font-size:11.5px;font-weight:600;margin-top:3px;}
  .delta.up{color:var(--rose-ink);} .delta.down{color:var(--mint-ink);}
  .summary-card.gasto{border-left:4px solid var(--rose-ink);} .summary-card.gasto .value{color:var(--rose-ink);}
  .summary-card.ingreso{border-left:4px solid var(--mint-ink);} .summary-card.ingreso .value{color:var(--mint-ink);}
  .summary-card.balance{border-left:4px solid var(--lav-ink);} .summary-card.balance .value{color:var(--lav-ink);}

  .fin-add{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:20px;}
  .fin-add-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .fin-add-toggle h3{font-size:15px;}
  .chevron{transition:transform .15s;color:var(--ink-soft);}
  .chevron.open{transform:rotate(180deg);}
  .fin-add-body{display:none;margin-top:14px;flex-direction:column;gap:12px;}
  .fin-add-body.open{display:flex;}
  .type-toggle{display:flex;gap:8px;}
  .type-btn{flex:1;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--bg);color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;}
  .type-btn.gasto.active{background:var(--rose);border-color:var(--rose-ink);color:var(--rose-ink);}
  .type-btn.ingreso.active{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink);}
  .scope-toggle{display:flex;gap:8px;}
  .scope-btn{flex:1;padding:9px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--bg);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;}
  .scope-btn.active{background:var(--sky);border-color:var(--sky-ink);color:var(--sky-ink);}
  .fin-row{display:flex;gap:10px;flex-wrap:wrap;}
  .fin-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;}
  .fin-field label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .fin-field input,.fin-field select{padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--ink);width:100%;}
  .fin-save{align-self:flex-end;padding:11px 22px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}

  .fin-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .fin-filters select{padding:8px 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink-soft);font-size:13px;}

  .mov-list{display:flex;flex-direction:column;gap:8px;}
  .mov{background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px 16px;display:flex;align-items:center;gap:12px;}
  .mov-cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .mov-body{flex:1;min-width:0;}
  .mov-desc{font-size:14.5px;} .mov-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .mov-amount{font-size:15px;font-weight:700;font-family:var(--font-display);flex-shrink:0;}
  .mov-amount.gasto{color:var(--rose-ink);} .mov-amount.ingreso{color:var(--mint-ink);}
  .group-pill{font-size:10px;font-weight:600;background:var(--lav);color:var(--lav-ink);padding:2px 7px;border-radius:10px;}

  .stats-section{margin-bottom:24px;}
  .stats-section h3{font-size:14.5px;margin-bottom:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-label{width:120px;flex-shrink:0;font-size:12.5px;display:flex;align-items:center;gap:6px;}
  .bar-label .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .bar-track{flex:1;height:9px;border-radius:6px;background:var(--bg);overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-amount{width:90px;text-align:right;flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--ink-soft);}

  .time-table{width:100%;border-collapse:collapse;font-size:13px;}
  .time-table th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:6px 10px;border-bottom:1.5px solid var(--line);}
  .time-table td{padding:8px 10px;border-bottom:1px solid var(--line);}
  .time-table td.num{text-align:right;font-weight:600;}
  .time-table .g{color:var(--rose-ink);} .time-table .i{color:var(--mint-ink);} .time-table .b{color:var(--lav-ink);}

  .period-sel{padding:8px 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink-soft);font-size:13px;margin-left:auto;}

  .insight-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .insight-card{flex:1;min-width:170px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;}
  .insight-card .ic-wrap{width:36px;height:36px;border-radius:10px;background:var(--sky);color:var(--sky-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .insight-card .ic-wrap svg{width:18px;height:18px;}
  .insight-card .ilabel{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
  .insight-card .ivalue{font-size:16px;font-weight:700;font-family:var(--font-display);line-height:1.25;}
  .insight-card .isub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .rank-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-num{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--ink-soft);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rank-row.top1 .rank-num{background:var(--butter);color:var(--butter-ink);}
  .rank-row.top2 .rank-num{background:var(--sky);color:var(--sky-ink);}
  .rank-row.top3 .rank-num{background:var(--peach);color:var(--peach-ink);}
  .rank-info{flex:1;min-width:0;}
  .rank-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .rank-name .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .rank-bar-track{height:6px;border-radius:4px;background:var(--bg);margin-top:5px;overflow:hidden;}
  .rank-bar-fill{height:100%;border-radius:4px;}
  .rank-amount{font-size:13.5px;font-weight:700;flex-shrink:0;width:88px;text-align:right;}
  .rank-pct{font-size:11px;color:var(--ink-soft);flex-shrink:0;width:36px;text-align:right;}

  .trend-chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding:0 4px;}
  .trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .trend-bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;}
  .trend-bar{width:40%;border-radius:4px 4px 0 0;min-height:2px;}
  .trend-bar.g{background:var(--rose);}
  .trend-bar.i{background:var(--mint);}
  .trend-label{font-size:10.5px;color:var(--ink-soft);}

  /* ===== Grupo ===== */
  .member-list{display:flex;flex-direction:column;gap:8px;}
  .member{background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:14px;}
  .avatar{border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .member .avatar{width:30px;height:30px;font-size:13px;}

  /* ===== Tiempo (estilo app Tiempo de iOS) ===== */
  .weather-search{max-width:420px;margin:40px auto;text-align:center;}
  .weather-search .ws-icon{width:52px;height:52px;color:var(--sky-ink);margin:0 auto 14px;}
  .weather-search h3{font-size:18px;margin-bottom:6px;}
  .weather-search p{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
  .weather-search-box{position:relative;}
  .weather-search-box input{width:100%;padding:12px 14px 12px 38px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:15px;background:var(--card);color:var(--ink);}
  .weather-search-box input:focus{outline:none;border-color:var(--primary);}
  .weather-search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);}
  .weather-results{margin-top:8px;text-align:left;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);overflow:hidden;}
  .weather-result-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:11px 14px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);}
  .weather-result-item:last-child{border-bottom:none;}
  .weather-result-item:hover{background:var(--bg);}
  .weather-result-item svg{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}
  .weather-result-item .wr-sub{color:var(--ink-soft);font-size:12px;margin-left:auto;}

  .weather-card{
    max-width:460px;margin:0 auto;border-radius:26px;padding:26px 24px 8px;color:#fff;
    background:linear-gradient(165deg,#5FA0DE 0%,#3F7BC0 55%,#2F5FA0 100%);
    box-shadow:0 16px 40px rgba(47,95,160,.35);
  }
  .weather-card.night{background:linear-gradient(165deg,#3A4A72 0%,#232F52 60%,#161C38 100%);box-shadow:0 16px 40px rgba(22,28,56,.4);}
  .weather-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .weather-top .wt-loc{font-size:16px;font-weight:600;}
  .weather-change-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:12px;padding:6px 12px;border-radius:16px;cursor:pointer;}
  .weather-hero{text-align:center;padding:14px 0 8px;}
  .weather-hero .wh-icon{width:64px;height:64px;margin:0 auto 4px;}
  .weather-hero .wh-temp{font-size:60px;font-weight:200;line-height:1;font-family:var(--font-display);}
  .weather-hero .wh-desc{font-size:15px;opacity:.92;text-transform:capitalize;margin-top:2px;}
  .weather-hero .wh-range{font-size:13px;opacity:.8;margin-top:4px;}
  .weather-meta-row{display:flex;justify-content:center;gap:22px;padding:14px 0;margin-top:6px;border-top:1px solid rgba(255,255,255,.2);font-size:12.5px;opacity:.9;}
  .weather-meta-row div{text-align:center;}
  .weather-meta-row .wm-label{opacity:.75;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  .weather-hourly{display:flex;gap:20px;overflow-x:auto;padding:14px 4px;border-top:1px solid rgba(255,255,255,.2);-webkit-overflow-scrolling:touch;}
  .weather-hourly::-webkit-scrollbar{display:none;}
  .weather-hourly .wh-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;min-width:36px;}
  .weather-hourly .wh-item .hlabel{font-size:11.5px;opacity:.85;}
  .weather-hourly .wh-item svg{width:22px;height:22px;}
  .weather-hourly .wh-item .htemp{font-size:13px;font-weight:600;}
  .weather-daily{padding:6px 0 20px;border-top:1px solid rgba(255,255,255,.2);}
  .wd-row{display:flex;align-items:center;gap:12px;padding:9px 2px;}
  .wd-row .wd-day{width:64px;font-size:13.5px;text-transform:capitalize;flex-shrink:0;}
  .wd-row svg{width:22px;height:22px;flex-shrink:0;}
  .wd-row .wd-bar-track{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.25);position:relative;overflow:hidden;}
  .wd-row .wd-bar-fill{position:absolute;height:100%;border-radius:3px;background:rgba(255,255,255,.85);}
  .wd-row .wd-min{font-size:13px;opacity:.7;width:32px;text-align:right;}
  .wd-row .wd-max{font-size:13px;font-weight:600;width:32px;text-align:right;}

  .task-weather-chip{display:flex;align-items:center;gap:8px;background:var(--sky);color:var(--sky-ink);padding:8px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;margin-top:8px;}
  .task-weather-chip svg{width:18px;height:18px;flex-shrink:0;}

  @media (max-width:480px){
    .weather-card{border-radius:20px;padding:22px 16px 6px;}
    .weather-hero .wh-temp{font-size:52px;}
    .weather-meta-row{gap:16px;}
    .weather-hourly{gap:14px;}
  }

  /* ===== Admin ===== */
  .admin-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);box-shadow:var(--shadow);}
  .admin-table{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px;background:var(--card);}
  .admin-table th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:10px 14px;background:var(--bg);}
  .admin-table td{padding:10px 14px;border-top:1px solid var(--line);}
  .role-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--lav);color:var(--lav-ink);}
  .role-badge.admin{background:var(--peach);color:var(--peach-ink);}
  .admin-table select{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;}
  .admin-actions{display:flex;gap:6px;}
  .admin-actions button{border:none;background:var(--bg);color:var(--ink-soft);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;}
  .admin-actions button.danger:hover{background:var(--rose);color:var(--rose-ink);}

  /* ===== Mobile top bar menu + drawer ===== */
  .menu-btn{display:none;background:none;border:none;color:var(--ink);padding:6px;border-radius:8px;cursor:pointer;}
  .menu-btn svg{width:22px;height:22px;display:block;}
  .drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(58,58,60,.35);z-index:90;}
  .drawer-backdrop.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:78%;max-width:300px;
    background:var(--card);z-index:91;
    transform:translateX(100%);transition:transform .22s ease;
    padding:calc(20px + var(--safe-t)) 20px 20px;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);box-shadow:-8px 0 24px rgba(0,0,0,.08);}
  .drawer .duname{font-size:16px;font-weight:700;font-family:var(--font-display);margin-bottom:2px;}
  .drawer .drole{font-size:12px;color:var(--ink-soft);margin-bottom:20px;}
  .drawer button.drawer-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:12px 10px;border:none;background:none;border-radius:var(--radius-sm);
    font-size:14.5px;color:var(--ink);cursor:pointer;
  }
  .drawer button.drawer-item:hover{background:var(--bg);}
  .drawer button.drawer-item.danger{color:var(--rose-ink);}
  .drawer{overflow-y:auto;}
  .drawer-section-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px 10px;}
  .drawer-section-label:first-of-type{margin-top:6px;}
  .drawer-divider{height:1px;background:var(--line);margin:10px 4px;}
  .drawer-nav-item{position:relative;}
  .drawer-nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700;}
  .drawer-nav-item .di-icon{width:19px;display:flex;justify-content:center;flex-shrink:0;}
  .drawer-nav-item .di-icon svg{width:18px;height:18px;display:block;}
  .drawer-close{position:absolute;top:calc(14px + var(--safe-t));right:14px;background:none;border:none;color:var(--ink-soft);padding:6px;cursor:pointer;}
  .drawer-close svg{width:18px;height:18px;display:block;}

  /* ===== Mobile bottom nav (native feel) ===== */
  .mobilenav{display:none;}

  @media (max-width:860px){
    :root{--toast-b:80px;}
    #shell{flex-direction:column;}
    .side{display:none;}
    .content{padding-bottom:calc(64px + var(--safe-b));}
    .app-header{
      position:fixed;top:0;left:0;right:0;
      padding:calc(10px + var(--safe-t)) 14px 10px;
    }
    .app-header .menu-btn{display:flex;}
    .app-header h1{font-size:16.5px;}
    .content{padding-top:calc(52px + var(--safe-t));}

    .mobilenav{
      display:flex;position:fixed;bottom:0;left:0;right:0;
      background:var(--glass);backdrop-filter:blur(14px);
      border-top:1px solid var(--line);
      padding:8px 6px calc(8px + var(--safe-b));
      z-index:50;
    }
    .mobilenav button{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      background:none;border:none;color:var(--ink-soft);font-size:10.5px;font-weight:600;
      padding:6px 2px;cursor:pointer;border-radius:12px;transition:background .15s,color .15s;
    }
    .mobilenav button .ic{font-size:19px;}
    .mobilenav button.active{color:var(--primary);background:var(--primary-soft);}

    #section-tareas{flex-direction:column;}
    .tsidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:12px 12px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
    .pinned{width:auto;margin-bottom:0;}
    .divider{display:none;}
    .tabs{flex-direction:row;overflow-x:auto;flex:0 0 100%;order:3;padding-top:6px;}
    .tab{flex-shrink:0;}
    .new-cat{width:auto;order:2;white-space:nowrap;}
    .main,.wide-main{padding:18px 16px 30px;max-width:100%;}
    .main-header h2{font-size:20px;}
    .bar-label{width:88px;font-size:11.5px;}
    .rank-row{gap:8px;}
    .rank-amount{width:70px;font-size:12.5px;}
    .rank-pct{width:28px;}
    .insight-row{gap:8px;}
    .insight-card{padding:12px 14px;min-width:140px;}
    input, select, textarea { font-size:16px !important; } /* evita zoom automático de iOS */

    #section-notas{flex-direction:column;}
    .notes-list-pane{width:100%;border-right:none;display:flex;}
    .notes-editor-pane{display:none;position:fixed;inset:0;background:var(--card);z-index:70;padding-bottom:var(--safe-b);}
    #section-notas.showing-editor .notes-list-pane{display:none;}
    #section-notas.showing-editor .notes-editor-pane{display:flex;}
    .note-back-btn{display:flex;}
    .notes-editor-body{padding:16px 18px;}

    .fab{bottom:calc(76px + var(--safe-b));right:18px;width:52px;height:52px;}
    .modal-sheet{
      left:0;top:auto;bottom:0;transform:none;
      max-width:100%;width:100%;max-height:88vh;
      border-radius:20px 20px 0 0;
      padding-bottom:var(--safe-b);
    }
    .modal-handle{display:block;width:36px;height:4px;border-radius:3px;background:var(--line);margin:10px auto 0;flex-shrink:0;}
  }

  /* ===================================================================== */
  /* NUEVO: botones, secciones a ancho completo, calendario, notas, perfil, grupos, tiempo */
  /* ===================================================================== */
  :root{ --header-h:67px; }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);border:1.5px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;line-height:1.2;}
  .btn svg{width:16px;height:16px;flex-shrink:0;display:block;}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-soft{background:var(--primary-soft);color:var(--primary);}
  .btn-soft:hover{background:var(--primary);color:#fff;}
  .btn-outline{background:var(--card);border-color:var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary);}
  .btn-danger{background:var(--rose);color:var(--rose-ink);}
  .btn-danger:hover{background:var(--rose-ink);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:13px;}
  .btn-block{width:100%;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;border:none;background:none;color:var(--ink-soft);cursor:pointer;padding:5px;border-radius:8px;flex-shrink:0;}
  .icon-btn:hover{background:var(--card);color:var(--rose-ink);}
  .icon-btn svg{width:15px;height:15px;display:block;}

  .side .userbox{padding:14px 4px 0;border-top:1px solid var(--line);margin-top:8px;display:flex;flex-direction:column;gap:10px;}
  .side .userbox .who{display:flex;align-items:center;gap:10px;min-width:0;}
  .side .userbox .who .avatar{width:34px;height:34px;font-size:13px;}
  .side .userbox .uname{color:var(--ink);font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .full-main{flex:1;padding:24px clamp(16px,3vw,44px) 44px;width:100%;min-width:0;}
  .full-main .fin-header{margin-bottom:20px;}

  /* ----- Tareas: vencidas ----- */
  .pinned .pcount{margin-left:auto;font-size:11px;font-weight:700;background:var(--rose);color:var(--rose-ink);border-radius:20px;padding:1px 8px;}
  #pinnedOverdue.active{background:var(--rose);color:var(--rose-ink);font-weight:600;}
  #pinnedOverdue.active .pcount{background:var(--card);}
  .past-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;}
  .past-controls .seg{margin:0;}
  .past-controls select{padding:8px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;}
  .past-note{font-size:12.5px;color:var(--ink-soft);margin:0 4px 12px;}

  /* ----- Calendario (sección propia) ----- */
  .cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;}
  .cal-card,.cal-panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
  .cal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .cal-title{font-family:var(--font-display);font-size:21px;font-weight:700;text-transform:capitalize;margin:0 6px;}
  .cal-head .spacer{flex:1;}
  .cal-nav-btn{background:var(--bg);border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;}
  .cal-nav-btn:hover{color:var(--primary);background:var(--primary-soft);}
  .cal-nav-btn svg{width:15px;height:15px;}
  .cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .cal-weekdays{margin-bottom:6px;}
  .cal-weekdays span{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .cal-cell{min-height:98px;border:1.5px solid var(--line);border-radius:12px;padding:6px 7px;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;transition:background .12s,border-color .12s;}
  .cal-cell:hover{background:var(--bg);}
  .cal-cell.other{opacity:.38;}
  .cal-cell.selected{border-color:var(--primary);background:var(--primary-soft);}
  .cal-num{align-self:flex-start;min-width:24px;height:24px;padding:0 4px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink);}
  .cal-cell.today .cal-num{background:var(--primary);color:#fff;}
  .cal-chips{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .cal-chip{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-chip.done{text-decoration:line-through;opacity:.5;}
  .cal-more{font-size:10.5px;color:var(--ink-soft);font-weight:700;padding-left:4px;}
  .cal-dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center;}
  .cal-dots span{width:5px;height:5px;border-radius:50%;}
  .cal-panel{position:sticky;top:calc(var(--header-h) + 18px);}
  .cal-panel h3{font-size:18px;text-transform:capitalize;}
  .cal-panel .cp-sub{font-size:12.5px;color:var(--ink-soft);margin:3px 0 12px;}
  .cp-progress{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;margin-bottom:14px;}
  .cp-progress div{height:100%;background:var(--mint-ink);border-radius:4px;transition:width .25s;}
  .cal-panel .list{margin-bottom:4px;}
  .cal-panel .task{box-shadow:none;background:var(--bg);padding:11px 12px;}
  .cal-panel .add-day-btn{margin-top:12px;}
  .cal-empty{font-size:13.5px;color:var(--ink-soft);text-align:center;padding:18px 0 6px;}
  .task-time{background:var(--bg);color:var(--ink-soft);}
  @media (max-width:1100px){
    .cal-layout{grid-template-columns:1fr;}
    .cal-panel{position:static;}
  }
  @media (max-width:860px){
    .cal-card,.cal-panel{padding:12px;}
    .cal-title{font-size:17px;}
    .cal-weekdays,.cal-grid{gap:3px;}
    .cal-cell{min-height:0;aspect-ratio:1/1.08;align-items:center;padding:5px 2px;border-radius:10px;}
    .cal-num{align-self:center;}
    .cal-chips{display:none;}
    .cal-dots{display:flex;}
  }

  /* ----- Notas: editor todo en uno y ancho completo ----- */
  .notes-editor-body{flex:1;padding:20px 28px;display:flex;flex-direction:column;min-height:0;max-width:none;width:100%;margin:0;}
  @media (max-width:860px){ .notes-editor-body{padding:16px 18px;} }
  .note-title-input{font-size:clamp(22px,2.4vw,30px);width:100%;}
  .note-rich{outline:none;padding-bottom:30vh;cursor:text;font-size:15.5px;}
  .note-rich.is-empty > p:first-child::before{content:'Escribe aquí… (admite Markdown: # título, - lista, **negrita**)';color:var(--ink-soft);opacity:.65;pointer-events:none;}
  .note-rich pre{white-space:pre-wrap;}
  .note-rich th,.note-rich td{min-width:80px;}
  .note-rich hr{height:0;}
  .note-rich a{cursor:pointer;}
  .tbl-handle{position:absolute;z-index:5;border:0;padding:0;margin:0;cursor:pointer;background:var(--primary-soft);color:var(--primary);border-radius:8px;opacity:.55;transition:opacity .12s,background .12s;display:flex;align-items:center;justify-content:center;font:600 16px/1 var(--font-body,inherit);}
  .tbl-handle:hover,.tbl-handle:focus-visible{opacity:1;background:var(--primary);color:#fff;}
  .tbl-add-col{width:18px;}
  .tbl-add-row{height:18px;}
  .tbl-tools{position:absolute;z-index:6;display:flex;gap:2px;transform:translate(-100%,-100%);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:2px;}
  .tbl-tools button{border:0;background:transparent;color:var(--ink-soft);font:600 12px/1 inherit;padding:6px 8px;border-radius:8px;cursor:pointer;}
  .tbl-tools button:hover{background:var(--primary-soft);color:var(--primary);}
  @media (pointer:coarse){
    .tbl-handle{opacity:.9;}
    .tbl-add-col{width:28px;}
    .tbl-add-row{height:28px;}
    .tbl-tools button{padding:9px 11px;font-size:13px;}
  }
  .fmt-btn.on{background:var(--primary-soft);color:var(--primary);}
  .fmt-btn b,.fmt-btn i,.fmt-btn s{font-size:14px;}
  @media (min-width:861px){
    .notes-list-pane{width:clamp(260px,24vw,340px);}
    .notes-editor-body{padding:22px clamp(18px,4vw,56px);}
    #section-notas.active{height:calc(100vh - var(--header-h));min-height:0;overflow:hidden;}
    #section-notas .notes-list-pane,#section-notas .notes-editor-pane{min-height:0;}
  }

  /* ----- Perfil ----- */
  .profile-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(135deg,var(--lav) 0%,#EEE9FB 100%);border-radius:22px;padding:26px 28px;margin-bottom:20px;}
  .profile-hero .avatar{width:72px;height:72px;font-size:26px;background:var(--card);color:var(--primary);box-shadow:var(--shadow);}
  .profile-hero .ph-info{flex:1;min-width:200px;}
  .profile-hero h2{font-size:26px;}
  .ph-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .ph-badge{font-size:12px;font-weight:600;background:rgba(255,255,255,.78);color:var(--lav-ink);padding:5px 12px;border-radius:20px;}
  .profile-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
  .pstat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
  .pstat b{display:block;font-size:28px;font-family:var(--font-display);line-height:1.1;}
  .pstat span{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:20px;align-items:start;}
  .pcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;}
  .pcard.wide{grid-column:1/-1;}
  .pcard h3{font-size:16.5px;margin-bottom:4px;}
  .pcard .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.45;}
  .pcard .auth-field input{background:var(--bg);}
  .pcat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
  .pcat{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:var(--radius-sm);padding:11px 12px;min-width:0;}
  .pcat .swatch{width:10px;height:10px;}
  .pcat .pc-name{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pcat .pc-count{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .session-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .session-card h3{margin:0 0 2px;}
  .session-card .sub{margin:0;}

  /* ----- Grupos ----- */
  .grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px;align-items:start;}
  .grp-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
  .grp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .grp-top h3{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grp-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--lav);color:var(--lav-ink);white-space:nowrap;}
  .grp-badge.owner{background:var(--peach);color:var(--peach-ink);}
  .grp-badge.exp{background:var(--mint);color:var(--mint-ink);}
  .grp-members{display:flex;flex-direction:column;gap:6px;}
  .grp-member{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 9px;border-radius:var(--radius-sm);background:var(--bg);min-width:0;}
  .grp-member .avatar{width:28px;height:28px;font-size:12px;}
  .grp-member .gm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grp-member .gm-role{font-size:11px;color:var(--ink-soft);}
  .grp-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .grp-invite{display:flex;gap:8px;}
  .grp-invite input,.grp-create input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--ink);}
  .grp-invite input:focus,.grp-create input:focus{outline:none;border-color:var(--primary);}
  .grp-create{display:flex;gap:8px;max-width:460px;margin-bottom:18px;}
  .pending-chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);padding:3px 4px 3px 11px;border-radius:20px;font-size:12.5px;margin:2px 6px 2px 0;}
  .invite-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--butter);border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;}
  .invite-card .ic-text{flex:1;min-width:200px;font-size:14px;}
  .invite-card .ic-btns{display:flex;gap:8px;}
  .grp-foot{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px;}
  .grp-hint{font-size:12.5px;color:var(--ink-soft);}

  /* ----- Tiempo: varias ciudades y vista compacta ----- */
  .wx-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .wx-bar h2{font-size:22px;margin-right:auto;}
  .wx-bar .seg{margin:0;}
  .wx-cities{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .wx-city{display:inline-flex;align-items:center;gap:7px;padding:8px 8px 8px 13px;border:1.5px solid var(--line);background:var(--card);border-radius:22px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .wx-city:hover{border-color:var(--sky-ink);color:var(--sky-ink);}
  .wx-city.active{background:var(--sky);border-color:var(--sky-ink);color:var(--sky-ink);}
  .wx-city svg{width:14px;height:14px;flex-shrink:0;}
  .wx-city .wx-x{display:flex;border:none;background:none;color:inherit;opacity:.5;cursor:pointer;padding:3px;border-radius:50%;}
  .wx-city .wx-x:hover{opacity:1;background:rgba(0,0,0,.07);}
  .wx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px;}
  .wx-tile{border:none;text-align:left;color:#fff;border-radius:20px;padding:14px 16px;cursor:pointer;background:linear-gradient(165deg,#5FA0DE 0%,#2F5FA0 100%);box-shadow:0 8px 22px rgba(47,95,160,.28);position:relative;display:flex;flex-direction:column;gap:2px;min-height:136px;font-family:inherit;}
  .wx-tile.night{background:linear-gradient(165deg,#3A4A72 0%,#161C38 100%);box-shadow:0 8px 22px rgba(22,28,56,.35);}
  .wx-tile.active{outline:3px solid var(--primary);outline-offset:2px;}
  .wx-tile .wxt-name{font-size:13.5px;font-weight:600;padding-right:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wx-tile .wxt-badge{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:12px;}
  .wx-tile .wxt-main{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
  .wx-tile .wxt-temp{font-size:38px;font-weight:300;line-height:1;font-family:var(--font-display);}
  .wx-tile .wxt-main svg{width:34px;height:34px;}
  .wx-tile .wxt-desc{font-size:12px;opacity:.92;}
  .wx-tile .wxt-range{font-size:11.5px;opacity:.78;}
  .wx-add{max-width:520px;margin:0 0 18px;}
  .wx-add .weather-search{margin:0;max-width:none;text-align:left;}
  .nav-dot{margin-left:auto;font-size:11px;font-weight:700;background:var(--rose);color:var(--rose-ink);border-radius:20px;padding:1px 8px;}
  .add-day-btn{display:flex;align-items:center;gap:7px;background:var(--primary-soft);color:var(--primary);border:none;padding:11px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;cursor:pointer;width:100%;justify-content:center;}
  .add-day-btn:hover{background:var(--primary);color:#fff;}
  .add-day-btn svg{width:14px;height:14px;}
  .wx-empty{max-width:420px;margin:30px auto;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* ===== Tema v2: premium · tecnológico · minimalista ===== */
  ::selection{background:color-mix(in srgb,var(--primary) 26%,transparent);}
  html{scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  body{
    font-variant-numeric:tabular-nums;
    background:
      radial-gradient(900px 420px at 88% -10%, color-mix(in srgb,var(--primary) 12%,transparent), transparent 70%),
      radial-gradient(700px 360px at -10% 2%, rgba(20,184,166,.08), transparent 70%),
      var(--bg);
    background-attachment:fixed;
  }
  h1,h2,h3{letter-spacing:-.028em;font-weight:620;}
  .side{background:color-mix(in srgb,var(--card) 55%,transparent);backdrop-filter:blur(20px) saturate(1.3);}
  .side .brand{font-weight:620;letter-spacing:-.025em;gap:10px;}
  .side .brand .dot,.auth-card h1 .dot{width:26px;height:26px;border-radius:9px;background:var(--grad);box-shadow:var(--glow);position:relative;flex-shrink:0;}
  .side .brand .dot::after,.auth-card h1 .dot::after{content:'';position:absolute;inset:7px;border-radius:50%;border:2px solid rgba(255,255,255,.92);border-right-color:transparent;transform:rotate(35deg);}
  .navbtn{border-radius:12px;font-weight:550;transition:background .15s,color .15s,box-shadow .15s;}
  .navbtn:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink);}
  .navbtn.active{background:color-mix(in srgb,var(--primary) 11%,transparent);color:var(--primary);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 22%,transparent);}
  .app-header{border-bottom:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.3);}
  .app-header h1{font-weight:620;}
  .section.active{animation:secIn .32s cubic-bezier(.2,.7,.2,1);}
  @keyframes secIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* botones principales con degradado */
  .auth-btn,.add-bar button.save,.fin-save,.btn-primary,.inline-form button:not(.cancel),.chip.active,.cal-cell.today .cal-num,.as-btn.primary{background:var(--grad);border-color:transparent;color:#fff;}
  .auth-btn,.fin-save,.btn-primary{box-shadow:0 8px 20px -10px rgba(91,92,240,.7);transition:transform .12s,box-shadow .15s,filter .15s;}
  .auth-btn:hover,.fin-save:hover,.btn-primary:hover{filter:brightness(1.06);}
  .auth-btn:active,.fin-save:active,.btn-primary:active{transform:scale(.985);}
  .fab{width:58px;height:58px;border-radius:19px;background:var(--grad);box-shadow:var(--glow);}
  .fab:hover{transform:translateY(-2px);}
  .btn,.auth-tab,.tab,.chip,.navbtn,.fab,.pinned,.add-day-btn{transition-property:background,color,box-shadow,transform,border-color,filter;transition-duration:.15s;}
  button:active:not(:disabled){transform:scale(.985);}

  /* campos */
  input:focus,textarea:focus,select:focus,.auth-field input:focus,.as-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--primary) 18%,transparent);}
  input,textarea,select{transition:border-color .15s,box-shadow .15s;}

  /* tarjetas y detalles */
  .task{border-radius:var(--radius);transition:box-shadow .2s,transform .2s;}
  @media (hover:hover){.task:hover{box-shadow:var(--shadow),0 14px 30px -18px rgba(91,92,240,.35);}}
  .task.done .box{background:var(--mint-ink);border-color:var(--mint-ink);}
  .box{border-width:1.75px;}
  .task-meta span{border-radius:8px;letter-spacing:.005em;}
  .empty{border:1px dashed var(--line);box-shadow:none;background:transparent;}
  .modal-backdrop,.drawer-backdrop{backdrop-filter:blur(6px);background:rgba(8,9,13,.42);}
  .modal-sheet{border-radius:22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45),0 0 0 1px var(--line);}
  .modal-handle{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 0;}
  .drawer{border-left:1px solid var(--line);}
  .auth-wrap{background:radial-gradient(700px 420px at 50% -5%, color-mix(in srgb,var(--primary) 18%,transparent), transparent 70%);}
  .auth-card{border-radius:26px;box-shadow:var(--shadow),0 40px 80px -40px rgba(91,92,240,.35);}
  .auth-tabs{border-radius:14px;}
  .auth-tab.active{box-shadow:var(--shadow);}
  .money,.rank-amount,.mov-amount,.num{font-family:var(--font-mono);font-weight:600;letter-spacing:-.02em;}
  .toggle-group,.seg{border-radius:12px;}

  @media (max-width:860px){
    :root{--toast-b:100px;--bottom-ui:calc(88px + var(--safe-b));}
    .content{padding-bottom:calc(96px + var(--safe-b));}
    .mobilenav{left:12px;right:12px;bottom:calc(10px + var(--safe-b));padding:6px;border-radius:24px;border:1px solid var(--line);
      background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 20px 44px -14px rgba(0,0,0,.35);}
    .mobilenav button{border-radius:18px;font-size:10px;font-weight:600;gap:4px;padding:8px 2px;}
    .mobilenav button.active{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);}
    .fab{bottom:calc(100px + var(--safe-b));right:16px;width:54px;height:54px;border-radius:18px;}
    .modal-sheet{border-radius:24px 24px 0 0;}
    .app-header{border-bottom-color:transparent;}
  }

  /* ===== Chat ===== */
  #section-chat{flex-direction:column;}
  .chat-main{width:100%;}
  .chat-shell{display:grid;grid-template-columns:276px minmax(0,1fr);height:calc(100dvh - var(--header-h,67px));width:100%;}
  .chat{max-width:860px;margin:0 auto;width:100%;height:100%;min-height:0;display:flex;flex-direction:column;padding:0 24px;}
  .chat-top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;flex-shrink:0;}
  .chat-id{display:flex;align-items:center;gap:11px;}
  .chat-id b{display:block;font-size:15px;letter-spacing:-.01em;}
  .chat-id small{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .chat-ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:12px;cursor:pointer;}
  .chat-ghost:hover{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 40%,var(--line));}
  .chat-ghost svg{width:15px;height:15px;display:block;}
  .chat-ghost.sm{padding:4px 9px;font-size:11.5px;border-radius:9px;background:transparent;}
  .chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 2px 14px;-webkit-overflow-scrolling:touch;}
  .chat-feed{display:flex;flex-direction:column;gap:20px;min-height:100%;}
  .orb{display:inline-block;border-radius:50%;flex-shrink:0;background:conic-gradient(from 200deg,#6D6EFF,#A56CFF,#22D3EE,#6D6EFF);position:relative;}
  .orb::after{content:'';position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,0) 62%);}
  .orb.xs{width:26px;height:26px;margin-top:2px;} .orb.sm{width:34px;height:34px;box-shadow:var(--glow);}
  .orb.lg{width:76px;height:76px;box-shadow:0 0 70px 6px color-mix(in srgb,var(--primary) 45%,transparent);animation:orbSpin 9s linear infinite;}
  .orb.spin{animation:orbSpin 1.6s linear infinite;}
  @keyframes orbSpin{to{transform:rotate(360deg);}}
  .chat-empty{margin:auto;text-align:center;padding:24px 4px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .chat-empty h2{font-size:clamp(21px,3vw,27px);margin-top:14px;}
  .chat-empty p{color:var(--ink-soft);font-size:14.5px;margin:0;max-width:340px;line-height:1.5;}
  .chat-sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px;width:100%;max-width:480px;}
  .chat-sugg button{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:550;padding:13px 14px;border-radius:14px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;}
  .chat-sugg button:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 45%,var(--line));}
  .msg{display:flex;animation:msgIn .3s cubic-bezier(.2,.7,.2,1);}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .msg.user{justify-content:flex-end;}
  .msg.user .bubble{max-width:84%;background:var(--grad);color:#fff;padding:10px 15px;border-radius:19px 19px 6px 19px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word;box-shadow:0 10px 24px -14px rgba(91,92,240,.8);}
  .msg.ai{gap:12px;align-items:flex-start;}
  .ai-col{flex:1;min-width:0;}
  .msg.ai .bubble{font-size:15.5px;line-height:1.65;word-break:break-word;}
  .msg.ai .bubble > :first-child{margin-top:0;} .msg.ai .bubble > :last-child{margin-bottom:0;}
  .msg.ai .bubble p{margin:.55em 0;} .msg.ai .bubble ul,.msg.ai .bubble ol{margin:.5em 0;padding-left:1.3em;}
  .msg.ai .bubble .reveal{animation:revealIn .45s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes revealIn{from{opacity:0;transform:translateY(6px);filter:blur(3px);}to{opacity:1;transform:none;filter:none;}}
  .msg-actions{margin-top:4px;opacity:0;transition:opacity .15s;}
  .msg.ai:hover .msg-actions,.msg.ai:focus-within .msg-actions{opacity:1;}
  @media (hover:none){.msg-actions{opacity:.8;}}
  .dots{display:flex;gap:5px;padding:11px 2px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--primary);opacity:.35;animation:dotPulse 1.1s ease-in-out infinite;}
  .dots i:nth-child(2){animation-delay:.16s;} .dots i:nth-child(3){animation-delay:.32s;}
  @keyframes dotPulse{40%{opacity:1;transform:translateY(-3px);}}
  .msg.err{justify-content:center;}
  .err-box{display:flex;align-items:center;gap:12px;background:var(--rose);color:var(--rose-ink);border-radius:14px;padding:10px 12px 10px 14px;font-size:13.5px;max-width:100%;}
  .err-box .chat-ghost{color:var(--rose-ink);border-color:currentColor;}
  .chat-composer{flex-shrink:0;padding:6px 0 calc(14px + var(--safe-b));}
  .chat-box{display:flex;align-items:flex-end;gap:6px;background:var(--card);border-radius:24px;padding:7px 7px 7px 18px;box-shadow:var(--shadow),0 20px 44px -26px rgba(91,92,240,.55);transition:box-shadow .15s;}
  .chat-box:focus-within{box-shadow:0 0 0 1.5px var(--primary),0 0 0 5px color-mix(in srgb,var(--primary) 14%,transparent),0 20px 44px -26px rgba(91,92,240,.6);}
  .chat-box textarea{flex:1;border:none;background:transparent;resize:none;outline:none !important;box-shadow:none !important;color:var(--ink);font:inherit;font-size:16px !important;line-height:1.45;padding:9px 0;max-height:150px;}
  .chat-round,.chat-send{width:40px;height:40px;border:none;border-radius:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chat-round{background:transparent;color:var(--ink-soft);}
  .chat-round:hover{background:var(--primary-soft);color:var(--primary);}
  .chat-round.rec{background:var(--rose-ink);color:#fff;animation:as-pulse 1.1s ease-in-out infinite;}
  .chat-send{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(91,92,240,.8);transition:opacity .15s,transform .15s;}
  .chat-send:disabled{opacity:.28;box-shadow:none;cursor:default;}
  .chat-round svg,.chat-send svg{width:20px;height:20px;display:block;}
  .chat-foot{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:9px;}
  @media (max-width:860px){
    .chat-shell{display:block;height:calc(100dvh - 52px - var(--safe-t) - var(--bottom-ui,0px));}
    .chat{padding:0 14px;}
    .chat-composer{padding-bottom:6px;}
    .chat-foot{display:none;}
    .chat-sugg{grid-template-columns:1fr 1fr;}
    body.chat-typing{--bottom-ui:0px;}
    body.chat-typing .mobilenav{display:none;}
    body.chat-typing .content{padding-bottom:0;}
    body.chat-typing .chat-composer{padding-bottom:calc(8px + var(--safe-b));}
  }

  /* cabecera: acciones agrupadas y alineadas */
  .app-header{gap:10px;}
  .hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .hdr-actions .header-weather{margin:0;}
